            if (!lastEraserArea) return showToast('पहले बॉक्स से एरिया मिटाएँ');
            const { x, y, w, h } = lastEraserArea;
            saveUndoState();
            const source = masterCtx.getImageData(x, y, w, h);
            const result = new ImageData(new Uint8ClampedArray(source.data), w, h);
            for (let py = 0; py < h; py++) {
                for (let px = 0; px < w; px++) {
                    let red = 0, green = 0, blue = 0, alpha = 0, count = 0;
                    for (let oy = -1; oy <= 1; oy++) {
                        for (let ox = -1; ox <= 1; ox++) {
                            const sx = Math.max(0, Math.min(w - 1, px + ox));
                            const sy = Math.max(0, Math.min(h - 1, py + oy));
                            const index = (sy * w + sx) * 4;
                            red += source.data[index];
                            green += source.data[index + 1];
                            blue += source.data[index + 2];
                            alpha += source.data[index + 3];
                            count++;
                        }
                    }
                    const index = (py * w + px) * 4;
                    result.data[index] = red / count;
                    result.data[index + 1] = green / count;
                    result.data[index + 2] = blue / count;
                    result.data[index + 3] = alpha / count;
                }
            }
            masterCtx.putImageData(result, x, y);
            showToast('मिटाया हुआ बॉक्स धुंधला किया गया ✓');
        }

        function matchLastEraserAreaToBackground() {
            if (!lastEraserArea) return showToast('पहले बॉक्स से एरिया मिटाएँ');
            const { x, y, w, h } = lastEraserArea;
            saveUndoState();
            const tone = getCanvasSurroundingTone(x + w / 2, y + h / 2, Math.max(w, h) / 2 + 5);
            masterCtx.fillStyle = `rgb(${tone.r}, ${tone.g}, ${tone.b})`;
            masterCtx.fillRect(x, y, w, h);
            showToast('बॉक्स का रंग बैकग्राउंड से मिलाया गया ✓');
        }

        function getCanvasSurroundingTone(x, y, radius) {
            const samplesR = [], samplesG = [], samplesB = [];
            const steps = 16;
            for (let i = 0; i < steps; i++) {
                const angle = (Math.PI * 2 * i) / steps;
                const sx = Math.round(x + Math.cos(angle) * radius);
                const sy = Math.round(y + Math.sin(angle) * radius);
                if (sx < 0 || sy < 0 || sx >= masterCanvas.width || sy >= masterCanvas.height) continue;
                const px = masterCtx.getImageData(sx, sy, 1, 1).data;
                samplesR.push(px[0]);
                samplesG.push(px[1]);
                samplesB.push(px[2]);
            }
            if (!samplesR.length) return parseHexToRGB(bgColor);
            return {
                r: Math.round(median(samplesR)),
                g: Math.round(median(samplesG)),
                b: Math.round(median(samplesB))
            };
        }

        function attachDirectTextEvents(el) {
            el.addEventListener('mousedown', (e) => {

                    textDragOffset.x = coords.x - parseFloat(el.dataset.canvasX);
                    textDragOffset.y = coords.y - parseFloat(el.dataset.canvasY);

            el.addEventListener('focus', () => {
                el.classList.add('editing');
                el.classList.remove('selected');
            });

            el.addEventListener('blur', () => {
                el.classList.remove('editing', 'typing');

                    el.remove();
                    if (activeTextElement === el) activeTextElement = null;

        function makeCanvasBackgroundTransparent(ctx, w, h) {
            const imgData = ctx.getImageData(0, 0, w, h);
            const d = imgData.data;

            const samplesR = [], samplesG = [], samplesB = [];
            const addSample = (idx) => {
                samplesR.push(d[idx]);
                samplesG.push(d[idx + 1]);
                samplesB.push(d[idx + 2]);
            };

            for (let i = 0; i < w; i++) {
                addSample((0 * w + i) * 4);
                addSample(((h - 1) * w + i) * 4);
            }
            for (let j = 0; j < h; j++) {
                addSample((j * w + 0) * 4);
                addSample((j * w + (w - 1)) * 4);
            }

            const bgR = samplesR.length ? median(samplesR) : 255;
            const bgG = samplesG.length ? median(samplesG) : 255;
            const bgB = samplesB.length ? median(samplesB) : 255;

            const tolMin = 22;
            const tolMax = 58;

            for (let i = 0; i < d.length; i += 4) {
                const dist = Math.hypot(d[i] - bgR, d[i + 1] - bgG, d[i + 2] - bgB);
                if (dist <= tolMin) {
                    d[i + 3] = 0;
                } else if (dist < tolMax) {
                    const alphaFactor = (dist - tolMin) / (tolMax - tolMin);
                    d[i + 3] = Math.round(255 * alphaFactor);
                    const a = d[i + 3] / 255;
                    if (a > 0) {
                        d[i] = Math.max(0, Math.min(255, Math.round((d[i] - bgR * (1 - a)) / a)));
                        d[i + 1] = Math.max(0, Math.min(255, Math.round((d[i + 1] - bgG * (1 - a)) / a)));
                        d[i + 2] = Math.max(0, Math.min(255, Math.round((d[i + 2] - bgB * (1 - a)) / a)));
                    }
                }
            }

            ctx.putImageData(imgData, 0, 0);
        }

        /* 100% सुव्यवस्थित कट, कॉपी और पेस्ट */
        function copyMarqueeArea() {
            if (!currentSelection || currentSelection.w < 2 || currentSelection.h < 2) return false;
            const { x, y, w, h } = currentSelection;
            internalClipboardCanvas = document.createElement('canvas');
            internalClipboardCanvas.width = w;
            internalClipboardCanvas.height = h;
            const ctx = internalClipboardCanvas.getContext('2d');
            ctx.drawImage(masterCanvas, x, y, w, h, 0, 0, w, h);

            if (copyTransparentBackground) {
                makeCanvasBackgroundTransparent(ctx, w, h);
            }
            internalClipboardType = 'marquee';
            return true;
        }

        function copyCurrentSelection() {
            // प्राथमिकता 1: यदि मार्की बॉक्स बना है तो मार्की का चयन ही कॉपी होगा
            if (currentSelection && currentSelection.w >= 2 && currentSelection.h >= 2) {
                if (copyMarqueeArea()) {
                    showToast(copyTransparentBackground ? 'मार्की शब्द (पारदर्शी) कॉपी हुआ ✓' : 'मार्की शब्द कॉपी हुआ ✓');
                    return;
                }
            }

            // प्राथमिकता 2: यदि कोई टेक्स्ट सेलेक्टेड है
            if (activeTextElement) {
                internalClipboardText = {
                    text: activeTextElement.innerText,
                    fontFamily: activeTextElement.style.fontFamily,
                    fontSize: activeTextElement.style.fontSize,
                    fontWeight: activeTextElement.style.fontWeight,
                    letterSpacing: activeTextElement.style.letterSpacing,
                    lineHeight: activeTextElement.style.lineHeight,
                    color: activeTextElement.style.color,
                    rotation: activeTextElement.dataset.rotation || '0'
                };
                internalClipboardType = 'text';
                showToast('टेक्स्ट कॉपी किया गया ✓');
                return;
            }

            // प्राथमिकता 3: यदि पहले से पेस्ट किया हुआ ऑब्जेक्ट सेलेक्टेड है
            if (activePastedElem) {
                const img = activePastedElem.querySelector('img');
                if (img) {
                    internalClipboardDataUrl = img.src;
                    internalClipboardW = parseFloat(activePastedElem.dataset.canvasW);
                    internalClipboardH = parseFloat(activePastedElem.dataset.canvasH);
                    internalClipboardType = 'image';
                    showToast('ऑब्जेक्ट कॉपी किया गया ✓');
                    return;
                }
            }
        }

        function cutCurrentSelection() {
            // प्राथमिकता 1: मार्की चयन कट करना
            if (currentSelection && currentSelection.w >= 2 && currentSelection.h >= 2) {
                if (currentSelection.w >= masterCanvas.width * 0.98 && currentSelection.h >= masterCanvas.height * 0.98) {
                    showToast('पूरा पेज कट नहीं किया जा सकता');
                    return;
                }

                copyMarqueeArea();
                saveUndoState();

                // बैकग्राउंड से ऑटो-टोन उठाकर खाली जगह भरना
                const tone = getCanvasSurroundingTone(
                    currentSelection.x + currentSelection.w / 2,
                    currentSelection.y + currentSelection.h / 2,
                    Math.max(currentSelection.w, currentSelection.h) / 2 + 5
                );
                masterCtx.fillStyle = `rgb(${tone.r}, ${tone.g}, ${tone.b})`;
                masterCtx.fillRect(currentSelection.x, currentSelection.y, currentSelection.w, currentSelection.h);

                removeMarqueeDiv();
                currentSelection = null;
                showToast('शब्द कट किया गया ✓');
                return;
            }

            // प्राथमिकता 2: टेक्स्ट कट करना
            if (activeTextElement) {
                copyCurrentSelection();
                saveUndoState();
                activeTextElement.remove();
                activeTextElement = null;
                showToast('टेक्स्ट कट किया गया ✓');
                return;
            }

            // प्राथमिकता 3: पेस्ट किया गया ऑब्जेक्ट कट करना
            if (activePastedElem) {
                copyCurrentSelection();
                saveUndoState();
                activePastedElem.remove();
                activePastedElem = null;
                showToast('ऑब्जेक्ट कट किया गया ✓');
                return;
            }
        }

        function cutMarqueeArea() {
            cutCurrentSelection();
        }

        function pasteFromClipboard() {
            // पेस्ट करने से पहले पिछले सभी चयन और मार्की हटा दें
            deselectAllObjects();
            removeMarqueeDiv();

            if (internalClipboardType === 'text' && internalClipboardText) {
                saveUndoState();
                const x = Math.max(0, Math.min(masterCanvas.width - 150, Math.round(lastCanvasPoint.x)));
                const y = Math.max(0, Math.min(masterCanvas.height - 50, Math.round(lastCanvasPoint.y)));
                createNewDirectTextAt(x, y);
                if (activeTextElement) {
                    activeTextElement.innerText = internalClipboardText.text;
                    activeTextElement.style.fontFamily = internalClipboardText.fontFamily;
                    activeTextElement.style.fontSize = internalClipboardText.fontSize;
                    activeTextElement.style.fontWeight = internalClipboardText.fontWeight;
                    activeTextElement.style.letterSpacing = internalClipboardText.letterSpacing;
                    activeTextElement.style.lineHeight = internalClipboardText.lineHeight;
                    activeTextElement.style.color = internalClipboardText.color;
                    setSelectedRotation(parseInt(internalClipboardText.rotation || '0'));
                }
                showToast('टेक्स्ट पेस्ट किया गया ✓');
                return;
            }

            if (internalClipboardType === 'image' && internalClipboardDataUrl) {
                saveUndoState();
                const w = internalClipboardW || 100;
                const h = internalClipboardH || 100;
                const x = Math.max(0, Math.min(masterCanvas.width - w, Math.round(lastCanvasPoint.x - w / 2)));
                const y = Math.max(0, Math.min(masterCanvas.height - h, Math.round(lastCanvasPoint.y - h / 2)));
                pasteImageToCanvasContainer(internalClipboardDataUrl, x, y, w, h);
                showToast('ऑब्जेक्ट पेस्ट किया गया ✓');
                return;
            }

            if (internalClipboardType === 'marquee' && internalClipboardCanvas) {
                saveUndoState();
                const w = internalClipboardCanvas.width;
                const h = internalClipboardCanvas.height;
                const x = Math.max(0, Math.min(masterCanvas.width - w, Math.round(lastCanvasPoint.x - w / 2)));
                const y = Math.max(0, Math.min(masterCanvas.height - h, Math.round(lastCanvasPoint.y - h / 2)));
                pasteImageToCanvasContainer(internalClipboardCanvas.toDataURL('image/png'), x, y, w, h);
                showToast('शब्द पेस्ट किया गया ✓');
                return;
            }

            showToast('क्लिपबोर्ड में कुछ नहीं है!');
        }

        function removeMarqueeDiv() {
            if (marqueeDiv) {
                marqueeDiv.remove();
                marqueeDiv = null;
            }
            currentSelection = null;
        }

        function pasteImageToCanvasContainer(dataUrl, x, y, w, h, initialRotation = '0') {
            deselectAllObjects();
            const container = document.getElementById('fullScreenCanvasContainer');
            const box = document.createElement('div');
            box.className = 'pasted-img-box selected';
            box.dataset.canvasX = x;
            box.dataset.canvasY = y;
            box.dataset.canvasW = w;
            box.dataset.canvasH = h;
            box.dataset.rotation = String(initialRotation);
            box.style.left = `${(x / masterCanvas.width) * 100}%`;
            box.style.top = `${(y / masterCanvas.height) * 100}%`;
            box.style.width = `${(w / masterCanvas.width) * 100}%`;
            box.style.height = `${(h / masterCanvas.height) * 100}%`;
            box.style.transform = `rotate(${initialRotation}deg)`;

            const img = document.createElement('img');
            img.src = dataUrl;
            img.style.width = '100%';
            img.style.height = '100%';
            img.style.pointerEvents = 'none';
            box.appendChild(img);
            container.appendChild(box);
            activePastedElem = box;

            let isMoving = false;
            let startPos = { x: 0, y: 0 };
            box.addEventListener('mousedown', (e) => {
                if (isSpacePressed) return;
                e.stopPropagation();
                deselectAllObjects();
                removeMarqueeDiv();
                activePastedElem = box;
                box.classList.add('selected');
                renderTopOptionsBar(currentTool);
                isMoving = true;
                startPos = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('mousemove', (e) => {
                if (isMoving && activePastedElem === box) {
                    const dx = (e.clientX - startPos.x) / currentScale;
                    const dy = (e.clientY - startPos.y) / currentScale;
                    startPos = { x: e.clientX, y: e.clientY };

                    const curX = parseFloat(box.dataset.canvasX) + dx;
                    const curY = parseFloat(box.dataset.canvasY) + dy;
                    box.dataset.canvasX = curX;
                    box.dataset.canvasY = curY;
                    box.style.left = `${(curX / masterCanvas.width) * 100}%`;
                    box.style.top = `${(curY / masterCanvas.height) * 100}%`;
                }
            });

            window.addEventListener('mouseup', () => { isMoving = false; });
            renderTopOptionsBar(currentTool);
        }

        function deleteSelected() {
            if (activeTextElement) {
                saveUndoState();
                activeTextElement.remove();
                activeTextElement = null;
                showToast('टेक्स्ट हटाया गया');
            } else if (activePastedElem) {
                saveUndoState();
                activePastedElem.remove();
                activePastedElem = null;
                showToast('ऑब्जेक्ट हटाया गया');
            } else if (currentSelection) {
                removeMarqueeDiv();
                showToast('मार्की चयन हटाया गया');
            }
        }

        function updateCloneRadius(v) {
            cloneRadius = Math.max(1, parseInt(v) || 1);
            document.getElementById('cloneRadiusVal').innerText = `${cloneRadius}px`;
            updateCloneCursorSize();
        }

        function updateCloneCursor(clientX, clientY) {
            const cursor = document.getElementById('cloneCursor');
            if (!cursor) return;
            const viewportRect = document.getElementById('mainViewport').getBoundingClientRect();
            cursor.style.left = `${clientX - viewportRect.left}px`;
            cursor.style.top = `${clientY - viewportRect.top}px`;
            updateCloneCursorSize();
            cursor.classList.remove('hidden');
        }

        function updateCloneCursorSize() {
            const cursor = document.getElementById('cloneCursor');
            if (!cursor) return;
            const diameter = Math.max(3, cloneRadius * 2 * currentScale);
            cursor.style.width = `${diameter}px`;
            cursor.style.height = `${diameter}px`;
        }

        function hideCloneCursor() {
            document.getElementById('cloneCursor').classList.add('hidden');
            document.getElementById('cloneSourceMarker').classList.add('hidden');
        }

        function performCloneAt(targetX, targetY) {
            const srcX = targetX - cloneOffset.x;
            const srcY = targetY - cloneOffset.y;
            masterCtx.save();
            masterCtx.globalAlpha = cloneOpacity / 100;
            masterCtx.beginPath();
            masterCtx.arc(targetX, targetY, cloneRadius, 0, Math.PI * 2);
            masterCtx.closePath();
            masterCtx.clip();
            masterCtx.drawImage(
                masterCanvas,
                srcX - cloneRadius, srcY - cloneRadius, cloneRadius * 2, cloneRadius * 2,
                targetX - cloneRadius, targetY - cloneRadius, cloneRadius * 2, cloneRadius * 2
            );
            masterCtx.restore();
        }

        function parseHexToRGB(h) {
            let r = 255, g = 255, b = 255;
            if (!h) return { r, g, b };
            if (h.startsWith('#')) {
                const hex = h.slice(1);
                if (hex.length === 3) {
                    r = parseInt(hex[0]+hex[0], 16);
                    g = parseInt(hex[1]+hex[1], 16);
                    b = parseInt(hex[2]+hex[2], 16);
                } else if (hex.length >= 6) {
                    r = parseInt(hex.slice(0,2), 16);
                    g = parseInt(hex.slice(2,4), 16);
                    b = parseInt(hex.slice(4,6), 16);
                }
            }
            return { r, g, b };
        }

        function rgbToHexValues(r, g, b) {
            return "#" + [r, g, b].map(x => {
                const hex = Math.max(0, Math.min(255, Math.round(x))).toString(16);
                return hex.length === 1 ? "0" + hex : hex;
            }).join("");
        }

        function rgbToHex(col) {
            if (!col) return '#000000';
            if (col.startsWith('#')) return col;
            const m = col.match(/\d+/g);
            if (m && m.length >= 3) return rgbToHexValues(m[0], m[1], m[2]);
            return '#000000';
        }

        function colorDist(r1, g1, b1, r2, g2, b2) {
            return Math.sqrt((r1 - r2)**2 + (g1 - g2)**2 + (b1 - b2)**2);
        }

        function median(values) {
            const sorted = values.slice().sort((a, b) => a - b);
            const middle = Math.floor(sorted.length / 2);
            return sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
        }

        /* कैनवास + पेस्टेड ऑब्जेक्ट्स दोनों की स्थिति को स्नैपशॉट में सहेजना */
        function captureOverlayState() {
            const overlays = [];
            document.querySelectorAll('.pasted-img-box').forEach(box => {
                const img = box.querySelector('img');
                if (img) {
                    overlays.push({
                        type: 'image',
                        src: img.src,
                        x: parseFloat(box.dataset.canvasX),
                        y: parseFloat(box.dataset.canvasY),
                        w: parseFloat(box.dataset.canvasW),
                        h: parseFloat(box.dataset.canvasH),
                        rotation: box.dataset.rotation || '0'
                    });
                }
            });
            return overlays;
        }

        function restoreOverlayState(overlays) {
            document.querySelectorAll('.pasted-img-box').forEach(el => el.remove());
            activePastedElem = null;
            if (!overlays || !overlays.length) return;
            overlays.forEach(item => {
                if (item.type === 'image') {
                    pasteImageToCanvasContainer(item.src, item.x, item.y, item.w, item.h, item.rotation);
                }
            });
            deselectAllObjects();
        }

        function saveUndoState() {
            if (undoStack.length >= MAX_HISTORY) undoStack.shift();
            undoStack.push({
                canvasData: masterCtx.getImageData(0, 0, masterCanvas.width, masterCanvas.height),
                overlays: captureOverlayState()
            });
            redoStack.length = 0;
        }

        function undo() {
            if (undoStack.length > 1) {
                const current = undoStack.pop();
                redoStack.push({
                    canvasData: masterCtx.getImageData(0, 0, masterCanvas.width, masterCanvas.height),
                    overlays: captureOverlayState()
                });
                const prev = undoStack[undoStack.length - 1];
                masterCtx.putImageData(prev.canvasData, 0, 0);
                restoreOverlayState(prev.overlays);
                removeMarqueeDiv();
                deselectAllObjects();
                showToast('Undo किया गया ✓');
            } else {
                showToast('शुरूआती दस्तावेज़ पर हैं');
            }
        }

        function redo() {
            if (redoStack.length > 0) {
                const st = redoStack.pop();
                undoStack.push({
                    canvasData: masterCtx.getImageData(0, 0, masterCanvas.width, masterCanvas.height),
                    overlays: captureOverlayState()
                });
                masterCtx.putImageData(st.canvasData, 0, 0);
                restoreOverlayState(st.overlays);
                removeMarqueeDiv();
                deselectAllObjects();
                showToast('Redo किया गया ✓');
            }
        }

        function handleFileSelect(input) {
            if (input.files && input.files[0]) loadFile(input.files[0]);
        }

        async function loadFile(file) {
            showStatus(`फ़ाइल लोड हो रही है: ${file.name}...`);
            if (file.type === 'application/pdf') {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                pagesArray = [];
                for (let i = 1; i <= pdf.numPages; i++) {
                    pagesArray.push({ type: 'pdf', pdfDoc: pdf, pageNum: i });
                }
                currentPageIndex = 0;
                document.getElementById('totalPagesNum').innerText = pagesArray.length;
                renderCurrentPage();
            } else if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        pagesArray = [{ type: 'image', img: img }];
                        currentPageIndex = 0;
                        renderCurrentPage();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        async function renderCurrentPage() {
            if (pagesArray.length === 0) return;
            const pageData = pagesArray[currentPageIndex];
            document.getElementById('currentPageNum').innerText = currentPageIndex + 1;
            document.querySelectorAll('.seamless-text-item, .pasted-img-box').forEach(el => el.remove());

            if (pageData.type === 'image') {
                masterCanvas.width = pageData.img.width;
                masterCanvas.height = pageData.img.height;
                masterCtx.drawImage(pageData.img, 0, 0);
            } else if (pageData.type === 'pdf') {
                const page = await pageData.pdfDoc.getPage(pageData.pageNum);
                const viewport = page.getViewport({ scale: 2.0 });
                masterCanvas.width = Math.round(viewport.width);
                masterCanvas.height = Math.round(viewport.height);
                await page.render({ canvasContext: masterCtx, viewport }).promise;
            }

            undoStack.length = 0;
            redoStack.length = 0;
            saveUndoState();

            fitToScreen();
            updateDimensionLabel();
            showStatus('पेज लोड हुआ!');
        }

        function changePage(delta) {
            const next = currentPageIndex + delta;
            if (next >= 0 && next < pagesArray.length) {
                currentPageIndex = next;
                renderCurrentPage();
            }
        }

        function getElementRealBaseline(el) {
            const savedTransform = el.style.transform;
            el.style.transform = 'none';

            let diff = 0;
            try {
                const testSpan = document.createElement('span');
                testSpan.style.display = 'inline-block';
                testSpan.style.width = '0px';
                testSpan.style.height = '0px';
                testSpan.style.verticalAlign = 'baseline';
                el.appendChild(testSpan);
                const spanRect = testSpan.getBoundingClientRect();
                const elRect = el.getBoundingClientRect();
                el.removeChild(testSpan);
                diff = (spanRect.top - elRect.top) / currentScale;
            } catch(err) {}

            el.style.transform = savedTransform;

            const fs = parseFloat(el.style.fontSize) || 18;
            if (diff > 2 && diff < 250) return diff;
            return fs * 0.82;
        }

        async function getFlattenedCanvas() {
            if (document.fonts && document.fonts.ready) {
                await document.fonts.ready;
            }

            const expCanvas = document.createElement('canvas');
            expCanvas.width = masterCanvas.width;
            expCanvas.height = masterCanvas.height;
            const expCtx = expCanvas.getContext('2d');
            expCtx.drawImage(masterCanvas, 0, 0);

            document.querySelectorAll('.pasted-img-box').forEach(box => {
                const img = box.querySelector('img');
                if (!img) return;
                const x = parseFloat(box.dataset.canvasX || (parseFloat(box.style.left) / 100) * masterCanvas.width);
                const y = parseFloat(box.dataset.canvasY || (parseFloat(box.style.top) / 100) * masterCanvas.height);
                const w = parseFloat(box.dataset.canvasW || (parseFloat(box.style.width) / 100) * masterCanvas.width);
                const h = parseFloat(box.dataset.canvasH || (parseFloat(box.style.height) / 100) * masterCanvas.height);
                const rot = parseFloat(box.dataset.rotation || '0');

                expCtx.save();
                expCtx.translate(x, y);
                expCtx.rotate((rot * Math.PI) / 180);
                expCtx.drawImage(img, 0, 0, w, h);
                expCtx.restore();
            });

            document.querySelectorAll('.seamless-text-item').forEach(el => {
                const x = parseFloat(el.dataset.canvasX || (parseFloat(el.style.left) / 100) * masterCanvas.width);
                const y = parseFloat(el.dataset.canvasY || (parseFloat(el.style.top) / 100) * masterCanvas.height);
                const fontSize = parseFloat(el.style.fontSize) || 18;
                let rawFont = el.style.fontFamily || 'Inter';
                const cleanFont = rawFont.replace(/['"]/g, '').trim();
                const fontWeight = el.style.fontWeight || '400';
                const fontStyle = el.style.fontStyle || 'normal';
                const color = el.style.color || '#000000';
                const letterSpacing = parseFloat(el.style.letterSpacing) || 0;
                const lineHeightMultiplier = parseFloat(el.style.lineHeight) || 1.15;
                const rot = parseFloat(el.dataset.rotation || '0');

                expCtx.save();
                expCtx.translate(x, y);
                expCtx.rotate((rot * Math.PI) / 180);

                expCtx.font = `${fontStyle} ${fontWeight} ${fontSize}px "${cleanFont}", "Tiro Devanagari Hindi", "Nirmala UI", "Mangal", sans-serif`;
                expCtx.fillStyle = color;
                expCtx.textBaseline = 'alphabetic';

                if ('letterSpacing' in expCtx) {
                    expCtx.letterSpacing = `${letterSpacing}px`;
                }

                const lineHeight = fontSize * lineHeightMultiplier;
                const baselineOffset = getElementRealBaseline(el);

                const lines = el.innerText.split('\n');
                lines.forEach((line, idx) => {
                    const lineY = baselineOffset + (idx * lineHeight);
                    expCtx.fillText(line, 0, lineY);
                });

                expCtx.restore();
            });

            return expCanvas;
        }

        async function exportAsImage(format) {
            const flat = await getFlattenedCanvas();
            const link = document.createElement('a');
            link.download = `Doc_${Date.now()}.${format}`;
            link.href = flat.toDataURL(format === 'png' ? 'image/png' : 'image/jpeg', 0.95);
            link.click();
        }

        async function exportAsPDF() {
            if (typeof window.jspdf === 'undefined') { alert('PDF लाइब्रेरी लोड हो रही है...'); return; }
            const { jsPDF } = window.jspdf;
            const flat = await getFlattenedCanvas();
            const imgData = flat.toDataURL('image/jpeg', 0.95);
            const orientation = flat.width > flat.height ? 'l' : 'p';
            const pdf = new jsPDF({ orientation, unit: 'px', format: [flat.width, flat.height] });
            pdf.addImage(imgData, 'JPEG', 0, 0, flat.width, flat.height);
            pdf.save(`Doc_${Date.now()}.pdf`);
        }

        async function printCurrentPage() {
            const flat = await getFlattenedCanvas();
            const win = window.open('', '_blank');
            win.document.write(`
                <html><head><title>Print</title><style>@page{size:auto;margin:0;}body{margin:0;}</style></head>
                <body><img src="${flat.toDataURL('image/jpeg', 0.95)}" style="width:100%;">
                <script>window.onload=function(){window.print();window.close();};<\/script>
                </body></html>
            `);
            win.document.close();
        }

        function toggleDropdown(id) {
            document.querySelectorAll('.dropdown-menu').forEach(m => {
                if (m.id !== id) m.classList.remove('show');
            });
            document.getElementById(id).classList.toggle('show');
        }

        window.addEventListener('click', (e) => {
            if (!e.target.closest('header')) {
                document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
            }
        });

        function showStatus(m) {
            document.getElementById('statusMessage').innerHTML = `<i class="fa-solid fa-circle-info text-sky-400 mr-1"></i> ${m}`;
        }
        function showToast(m) { showStatus(m); }
    </script>
</body>
