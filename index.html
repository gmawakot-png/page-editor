<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>एडवांस्ड दस्तावेज़ संपादक (Ultra-Fast Canvas Editor)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Dancing+Script:wght@700&family=Great+Vibes&family=Inconsolata:wght@400;700&family=Indie+Flower&family=Inter:wght@400;600;700&family=Kalam:wght@400;700&family=Lora:ital,wght@0,400;0,700;1,400&family=Merriweather:wght@400;700&family=Montserrat:wght@400;700&family=Open+Sans:wght@400;700&family=Pacifico&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Press+Start+2P&family=Roboto+Mono:wght@400;700&family=Roboto+Slab:wght@400;700&family=Roboto:ital,wght@0,400;0,700;1,400&family=Rozha+One&family=Tiro+Devanagari+Hindi:ital@0;1&family=Yatra+One&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        @font-face { font-family: 'KrutiDev'; src: local('Kruti Dev 010'), local('KrutiDev010'), local('Kruti Dev'); }
        @font-face { font-family: 'DevLys'; src: local('DevLys 010'), local('DevLys010'), local('DevLys'); }
        @font-face { font-family: 'WalkmanChanakya'; src: local('Walkman-Chanakya-905'), local('Chanakya'); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e222b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3b4252; border-radius: 2px; }
        .checkerboard {
            background-color: #23262d;
            background-image:
                linear-gradient(45deg, #1b1d23 25%, transparent 25%),
                linear-gradient(-45deg, #1b1d23 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #1b1d23 75%),
                linear-gradient(-45deg, transparent 75%, #1b1d23 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        #viewportWrapper { position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; user-select: none; }
        #canvasTransformLayer { transform-origin: 0 0; position: absolute; top: 0; left: 0; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); }
        .seamless-text-item {
            position: absolute; outline: none !important; border: none !important;
            white-space: pre-wrap; word-break: break-word; cursor: text; user-select: text;
            line-height: 1.15; padding: 0px !important; margin: 0 !important;
            box-sizing: border-box; background: transparent; transform-origin: 0 0; z-index: 60;
        }
        .seamless-text-item:hover { outline: 1px dashed rgba(56, 189, 248, 0.6) !important; outline-offset: 1px; }
        .seamless-text-item.selected { outline: 1px dashed #38bdf8 !important; outline-offset: 1px; background: rgba(56, 189, 248, 0.08); }
        .seamless-text-item.editing { outline: 1px solid #38bdf8 !important; outline-offset: 1px; background: rgba(15, 23, 42, 0.25) !important; cursor: text !important; user-select: text !important; }
        .seamless-text-item.typing { cursor: text !important; user-select: text !important; }
        .clone-brush-circle { position: absolute; width: 40px; height: 40px; border: 1.5px solid #38bdf8; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); box-shadow: 0 0 4px rgba(0,0,0,0.5); z-index: 9999; }
        .clone-source-marker { position: absolute; width: 14px; height: 14px; border: 1.5px solid #ef4444; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); z-index: 9999; }
        .clone-source-marker::before, .clone-source-marker::after { content: ''; position: absolute; background: #ef4444; }
        .clone-source-marker::before { top: 5px; left: -4px; width: 20px; height: 1.5px; }
        .clone-source-marker::after { top: -4px; left: 5px; width: 1.5px; height: 20px; }
        .tool-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 48px; border-radius: 6px; color: #94a3b8; font-size: 10px; gap: 3px; transition: all 0.15s ease; }
        .tool-btn i { font-size: 16px; }
        .tool-btn:hover { background: #334155; color: #f8fafc; }
        .tool-btn.active { background: #0284c7; color: #ffffff; box-shadow: 0 0 10px rgba(2, 132, 199, 0.4); }
        .tool-btn-whiten {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 50%, #fcd34d 100%);
            color: #78350f !important;
            border: 1px solid #f59e0b;
            box-shadow: 0 2px 6px rgba(245, 158, 11, 0.35);
        }
        .tool-btn-whiten:hover { background: linear-gradient(135deg, #fde68a, #fbbf24) !important; color: #000 !important; }
        .tool-btn-whiten i { color: #b45309; font-size: 17px; }
        .tool-btn-whiten span { font-weight: 800; font-size: 9.5px; letter-spacing: 0.3px; }
        .sub-bar-btn { padding: 3px 8px; font-size: 11px; font-weight: 600; border-radius: 4px; display: inline-flex; align-items: center; gap: 5px; color: #cbd5e1; background: #1e293b; border: 1px solid #334155; cursor: pointer; white-space: nowrap; transition: all 0.15s ease; }
        .sub-bar-btn:hover { background: #334155; color: #ffffff; }
        .dropdown-menu { display: none; position: absolute; background: #1e222b; border: 1px solid #3b4252; border-radius: 6px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); z-index: 100; }
        .dropdown-menu.show { display: block; }
        .pasted-img-box { position: absolute; box-sizing: border-box; cursor: move; border: 1px dashed transparent; z-index: 50; transform-origin: 0 0; background: transparent !important; }
        .pasted-img-box:hover { border: 1px dashed rgba(56, 189, 248, 0.5); }
        .pasted-img-box.selected { border: 1px dashed #38bdf8 !important; background: transparent !important; }
        .editor-eraser-preview { position: absolute; pointer-events: none; z-index: 9999; border: 1px dashed #ec4899; background: rgba(236, 72, 153, 0.15); box-sizing: border-box; }
        .export-input {
            background: #121418; border: 1px solid #334155; border-radius: 5px;
            padding: 4px 8px; color: #e2e8f0; font-size: 11px; outline: none;
            transition: border-color 0.15s ease;
        }
        .export-input:focus { border-color: #0ea5e9; box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.15); }
        .export-input::placeholder { color: #64748b; }
        select.export-input { cursor: pointer; padding-right: 4px; }
        select.export-input option { background: #121418; color: #e2e8f0; }
    </style>
</head>
<body class="bg-[#121418] text-slate-200 h-screen w-screen flex flex-col overflow-hidden font-sans select-none">

    <header class="h-10 bg-[#1a1d24] border-b border-slate-800 flex items-center justify-between px-3 z-50 shrink-0">
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 font-bold text-sm text-sky-400 tracking-wider mr-2">
                <i class="fa-solid fa-file-pen text-lg"></i> UltraDoc Editor
            </div>
            <div class="flex items-center text-xs gap-1">
                <div class="relative">
                    <button onclick="toggleDropdown('fileMenu')" class="px-2.5 py-1 hover:bg-slate-700/60 rounded text-slate-300 font-medium">फ़ाइल</button>
                    <div id="fileMenu" class="dropdown-menu top-full left-0 mt-1 w-52 py-1">
                        <label class="px-3 py-1.5 hover:bg-sky-600 hover:text-white flex items-center gap-2 cursor-pointer">
                            <i class="fa-solid fa-folder-open w-4"></i> एक खोलें (PDF / चित्र)
                            <input type="file" id="mainFileInput" accept="image/*,application/pdf" class="hidden" onchange="handleFileSelect(this)">
                        </label>
                        <label class="px-3 py-1.5 hover:bg-green-600 hover:text-white flex items-center gap-2 cursor-pointer bg-slate-700/50">
                            <i class="fa-solid fa-files w-4"></i> 🆕 मल्टीपल खोलें
                            <input type="file" id="multipleFileInput" accept="image/*,application/pdf" multiple class="hidden" onchange="handleMultipleFiles(this)">
                        </label>
                        <div class="h-[1px] bg-slate-700 my-1"></div>
                        <button onclick="printCurrentPage()" class="w-full text-left px-3 py-1.5 hover:bg-sky-600 hover:text-white flex items-center gap-2">
                            <i class="fa-solid fa-print w-4"></i> प्रिंट करें <span class="ml-auto text-[10px] text-slate-400">Ctrl+P</span>
                        </button>
                        <button onclick="exportWithOptions()" class="w-full text-left px-3 py-1.5 hover:bg-sky-600 hover:text-white flex items-center gap-2">
                            <i class="fa-solid fa-download w-4"></i> एक्सपोर्ट (चुना हुआ फ़ॉर्मेट)
                        </button>
                    </div>
                </div>
                <div class="relative">
                    <button onclick="toggleDropdown('editMenu')" class="px-2.5 py-1 hover:bg-slate-700/60 rounded text-slate-300 font-medium">एडिट</button>
                    <div id="editMenu" class="dropdown-menu top-full left-0 mt-1 w-44 py-1">
                        <button onclick="undo()" class="w-full text-left px-3 py-1.5 hover:bg-sky-600 hover:text-white flex items-center justify-between">
                            <span><i class="fa-solid fa-rotate-left w-4"></i> Undo</span><span class="text-[10px] text-slate-400">Ctrl+Z</span>
                        </button>
                        <button onclick="redo()" class="w-full text-left px-3 py-1.5 hover:bg-sky-600 hover:text-white flex items-center justify-between">
                            <span><i class="fa-solid fa-rotate-right w-4"></i> Redo</span><span class="text-[10px] text-slate-400">Ctrl+Y</span>
                        </button>
                        <div class="h-[1px] bg-slate-700 my-1"></div>
                        <button onclick="cutCurrentSelection()" class="w-full text-left px-3 py-1.5 hover:bg-sky-600 hover:text-white flex items-center justify-between">
                            <span><i class="fa-solid fa-scissors w-4"></i> Cut</span><span class="text-[10px] text-slate-400">Ctrl+X</span>
                        </button>
                        <button onclick="copyCurrentSelection()" class="w-full text-left px-3 py-1.5 hover:bg-sky-600 hover:text-white flex items-center justify-between">
                            <span><i class="fa-solid fa-copy w-4"></i> Copy</span><span class="text-[10px] text-slate-400">Ctrl+C</span>
                        </button>
                        <button onclick="pasteFromClipboard()" class="w-full text-left px-3 py-1.5 hover:bg-sky-600 hover:text-white flex items-center justify-between">
                            <span><i class="fa-solid fa-paste w-4"></i> Paste</span><span class="text-[10px] text-slate-400">Ctrl+V</span>
                        </button>
                        <div class="h-[1px] bg-slate-700 my-1"></div>
                        <button onclick="deleteSelected()" class="w-full text-left px-3 py-1.5 hover:bg-red-600 hover:text-white flex items-center justify-between">
                            <span><i class="fa-solid fa-trash w-4"></i> हटाएं</span><span class="text-[10px] text-slate-400">Del</span>
                        </button>
                    </div>
                </div>
                <div class="relative">
                    <button onclick="toggleDropdown('viewMenu')" class="px-2.5 py-1 hover:bg-slate-700/60 rounded text-slate-300 font-medium">व्यू</button>
                    <div id="viewMenu" class="dropdown-menu top-full left-0 mt-1 w-44 py-1">
                        <button onclick="resetZoom()" class="w-full text-left px-3 py-1.5 hover:bg-sky-600 hover:text-white flex items-center gap-2">
                            <i class="fa-solid fa-expand w-4"></i> 100% आकार
                        </button>
                        <button onclick="fitToWidth()" class="w-full text-left px-3 py-1.5 hover:bg-sky-600 hover:text-white flex items-center gap-2">
                            <i class="fa-solid fa-arrows-left-right w-4"></i> चौड़ाई में फिट
                        </button>
                        <button onclick="fitToScreen()" class="w-full text-left px-3 py-1.5 hover:bg-sky-600 hover:text-white flex items-center gap-2">
                            <i class="fa-solid fa-compress w-4"></i> स्क्रीन पर फिट
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div id="pdfPageNav" class="flex items-center gap-2 text-xs bg-[#121418] px-2 py-0.5 rounded border border-slate-800">
            <button onclick="changePage(-1)" class="text-slate-400 hover:text-white px-1"><i class="fa-solid fa-chevron-left"></i></button>
            <span class="font-medium text-slate-300">पेज <span id="currentPageNum" class="text-sky-400 font-bold">1</span> / <span id="totalPagesNum">1</span></span>
            <button onclick="changePage(1)" class="text-slate-400 hover:text-white px-1"><i class="fa-solid fa-chevron-right"></i></button>
        </div>

        <div class="flex items-center gap-2">
            <button onclick="undo()" title="Undo (Ctrl+Z)" class="p-1.5 hover:bg-slate-700 rounded text-slate-300 text-xs"><i class="fa-solid fa-rotate-left"></i></button>
            <button onclick="redo()" title="Redo (Ctrl+Y)" class="p-1.5 hover:bg-slate-700 rounded text-slate-300 text-xs"><i class="fa-solid fa-rotate-right"></i></button>
            <div class="h-4 w-[1px] bg-slate-700 mx-1"></div>
            <button onclick="printCurrentPage()" title="प्रिंट करें (Ctrl+P)" class="p-1.5 hover:bg-slate-700 rounded text-slate-300 text-xs"><i class="fa-solid fa-print"></i></button>

            <div class="flex items-center gap-1 bg-[#121418] border border-slate-700 rounded pl-2 pr-1 py-0.5" title="फ़ाइल का नाम यहाँ लिखें">
                <i class="fa-solid fa-tag text-slate-500 text-[10px]"></i>
                <input type="text" id="exportFileName" value="Doc" placeholder="फ़ाइल नाम"
                    class="w-28 bg-transparent border-0 text-slate-200 text-[11px] outline-none placeholder-slate-500"
                    onkeydown="if(event.key==='Enter'){event.preventDefault();exportWithOptions();}">
            </div>

            <div class="flex items-center gap-1 bg-[#121418] border border-slate-700 rounded pl-2 pr-1 py-0.5" title="डाउनलोड फ़ॉर्मेट चुनें">
                <i class="fa-solid fa-file-arrow-down text-slate-500 text-[10px]"></i>
                <select id="exportFormat" class="bg-transparent border-0 text-slate-200 text-[11px] outline-none cursor-pointer">
                    <option value="jpeg" selected>JPEG</option>
                    <option value="png">PNG</option>
                    <option value="pdf">PDF</option>
                </select>
            </div>

            <button onclick="exportWithOptions()" class="bg-sky-600 hover:bg-sky-500 text-white font-semibold text-xs px-3 py-1.5 rounded flex items-center gap-1.5 shadow">
                <i class="fa-solid fa-download"></i> एक्सपोर्ट
            </button>
        </div>
    </header>

    <section id="topOptionsBar" class="h-10 bg-[#1e222b] border-b border-slate-800 flex items-center px-3 gap-2 text-xs shrink-0 z-40 overflow-x-auto overflow-y-hidden custom-scrollbar whitespace-nowrap"></section>

    <div class="flex-1 flex overflow-hidden relative">
        <aside class="w-14 bg-[#1a1d24] border-r border-slate-800 flex flex-col items-center py-2 gap-1 z-30 shrink-0 overflow-y-auto custom-scrollbar">
            <button onclick="setActiveTool('select')" id="tool-select" class="tool-btn active" title="चयन टूल (V)">
                <i class="fa-solid fa-arrow-pointer"></i><span>चयन</span>
            </button>
            <button onclick="setActiveTool('pan')" id="tool-pan" class="tool-btn" title="पैन टूल (H)">
                <i class="fa-solid fa-hand"></i><span>पैन</span>
            </button>
            <div class="w-8 h-[1px] bg-slate-800 my-1"></div>
            <button onclick="setActiveTool('marquee')" id="tool-marquee" class="tool-btn" title="मार्की क्रॉप / कॉपी (M)">
                <i class="fa-regular fa-square"></i><span>मार्की</span>
            </button>
            <button onclick="setActiveTool('clone')" id="tool-clone" class="tool-btn" title="क्लोन स्टैम्प टूल (S)">
                <i class="fa-solid fa-stamp"></i><span>क्लोन</span>
            </button>
            <button onclick="setActiveTool('eraser')" id="tool-eraser" class="tool-btn" title="रबर टूल (E)">
                <i class="fa-solid fa-eraser"></i><span>रबर</span>
            </button>
            <button onclick="setActiveTool('text')" id="tool-text" class="tool-btn" title="टेक्स्ट टूल (T)">
                <i class="fa-solid fa-font"></i><span>टेक्स्ट</span>
            </button>

            <!-- ⭐ दो रंग-बॉक्स: ऊपर = मिटाने वाला रंग, नीचे = न मिटने वाला रंग -->
            <div class="flex flex-col items-center gap-1 mt-1" title="ऊपर: मिटाने वाला रंग | नीचे: न मिटने वाला रंग">
                <div class="relative w-7 h-9">
                    <input type="color" id="globalFgPicker" value="#111827"
                        onchange="updateGlobalColor('fg', this.value)"
                        class="absolute top-0 left-0 w-5 h-5 p-0 border border-slate-600 rounded cursor-pointer z-10"
                        title="ऊपर का रंग — मिटाने वाला रंग (जो मिटाना है)">
                    <input type="color" id="globalBgPicker" value="#000000"
                        onchange="updateProtectColorFromSidebar(this.value)"
                        class="absolute bottom-0 right-0 w-5 h-5 p-0 border border-slate-600 rounded cursor-pointer"
                        title="नीचे का रंग — न मिटने वाला रंग (जो सुरक्षित रहेगा)">
                </div>
                <span class="text-[9px] text-slate-400 leading-tight text-center">मिटाने/<br>सुरक्षित</span>
            </div>
            <div class="w-8 h-[1px] bg-slate-800 my-2"></div>
            <button onclick="whitenBackground()" id="tool-whiten" class="tool-btn tool-btn-whiten" title="बैकग्राउंड व्हाइट करें (Ctrl+Shift+W)">
                <i class="fa-solid fa-fill-drip"></i><span>व्हाइट</span>
            </button>
        </aside>

        <main id="mainViewport" class="flex-1 relative overflow-hidden checkerboard">
            <div id="viewportWrapper">
                <div id="canvasTransformLayer">
                    <div id="fullScreenCanvasContainer" class="relative">
                        <canvas id="masterCanvas" class="block bg-white shadow-2xl"></canvas>
                    </div>
                </div>
            </div>
            <div id="cloneCursor" class="clone-brush-circle hidden"></div>
            <div id="cloneSourceMarker" class="clone-source-marker hidden"></div>
        </main>

        <aside id="rightPanel" class="w-64 bg-[#1a1d24] border-l border-slate-800 flex flex-col z-30 shrink-0 text-xs">
            <div class="h-9 border-b border-slate-800 flex items-center justify-between px-3 bg-[#1e222b] font-semibold text-slate-300">
                <span class="flex items-center gap-1.5"><i class="fa-solid fa-sliders text-sky-400"></i> सेटिंग्स</span>
                <span id="rightPanelContext" class="text-[10px] text-slate-500 uppercase tracking-wide">सामान्य</span>
            </div>
            <div class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-4">
                <div id="textPropertiesBox" class="space-y-3">
                    <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">फ़ॉन्ट सेटिंग्स</div>
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">फ़ॉन्ट फ़ैमिली</label>
                        <select id="rightFontFamily" onchange="updateSelectedTextProp('fontFamily', this.value)" class="w-full bg-[#121418] border border-slate-700 rounded px-2 py-1 text-slate-200">
                            <optgroup label="Hindi Standard">
                                <option value="Tiro Devanagari Hindi">Tiro Devanagari Hindi</option>
                                <option value="Rozha One">Rozha One</option>
                                <option value="Yatra One">Yatra One</option>
                                <option value="Kalam">Kalam (Handwriting)</option>
                            </optgroup>
                            <optgroup label="Legacy Hindi">
                                <option value="KrutiDev">Kruti Dev 010</option>
                                <option value="DevLys">DevLys 010</option>
                                <option value="WalkmanChanakya">Chanakya</option>
                            </optgroup>
                            <optgroup label="English Fonts">
                                <option value="Inter" selected>Inter (Clean Sans)</option>
                                <option value="Roboto">Roboto</option>
                                <option value="Open Sans">Open Sans</option>
                                <option value="Montserrat">Montserrat</option>
                                <option value="Playfair Display">Playfair Display</option>
                                <option value="Merriweather">Merriweather</option>
                                <option value="Lora">Lora</option>
                                <option value="Inconsolata">Inconsolata (Typewriter)</option>
                                <option value="Dancing Script">Dancing Script</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-1">साइज (px)</label>
                            <input type="number" id="rightFontSize" min="6" max="250" value="18" onchange="updateSelectedTextProp('fontSize', this.value + 'px')" class="w-full bg-[#121418] border border-slate-700 rounded px-2 py-1 text-slate-200">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-1">रंग</label>
                            <input type="color" id="rightFontColor" value="#000000" oninput="applySelectedTextColor(this.value)" onchange="applySelectedTextColor(this.value)" class="w-full h-[28px] bg-[#121418] border border-slate-700 rounded px-1 py-0.5 cursor-pointer">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-1">मोटाई</label>
                            <input type="number" id="rightFontWeight" min="100" max="1000" step="100" value="400" oninput="updateSelectedTextProp('fontWeight', this.value)" class="w-full bg-[#121418] border border-slate-700 rounded px-2 py-1 text-slate-200">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-1">लेटर स्पेसिंग</label>
                            <input type="number" id="rightLetterSpacing" step="0.5" value="0" onchange="updateSelectedTextProp('letterSpacing', this.value + 'px')" class="w-full bg-[#121418] border border-slate-700 rounded px-2 py-1 text-slate-200">
                        </div>
                    </div>
                    <div class="flex items-center gap-1 bg-[#121418] p-1 border border-slate-700 rounded justify-around">
                        <button onclick="toggleTextStyle('bold')" class="p-1 hover:bg-slate-700 rounded text-slate-300 font-bold w-7">B</button>
                        <button onclick="toggleTextStyle('italic')" class="p-1 hover:bg-slate-700 rounded text-slate-300 italic w-7">I</button>
                        <button onclick="toggleTextStyle('underline')" class="p-1 hover:bg-slate-700 rounded text-slate-300 underline w-7">U</button>
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">लाइन स्पेसिंग</label>
                        <input type="number" id="rightLineHeight" step="0.05" value="1.15" onchange="updateSelectedTextProp('lineHeight', this.value)" class="w-full bg-[#121418] border border-slate-700 rounded px-2 py-1 text-slate-200">
                    </div>
                </div>

                <div class="pt-3 border-t border-slate-800 space-y-2">
                    <div class="text-[11px] font-bold text-amber-400 uppercase tracking-wider">⚡ वन-क्लिक व्हाइटनर</div>
                    <button onclick="whitenBackground()" class="w-full bg-gradient-to-r from-amber-500 to-yellow-400 hover:from-amber-400 hover:to-yellow-300 text-amber-950 font-bold text-xs py-2 rounded shadow flex items-center justify-center gap-2">
                        <i class="fa-solid fa-fill-drip"></i> बैकग्राउंड व्हाइट करें
                    </button>
                    <div class="text-[10px] text-slate-500 leading-snug">
                        पेपर का रंग हटाकर शुद्ध सफ़ेद कर देगा। लिखाई, मुहर और चित्र सुरक्षित रहेंगे।
                    </div>
                    <div class="flex items-center gap-2 pt-1">
                        <label class="text-[10px] text-slate-400 flex-1">गहराई (Tolerance)</label>
                        <input type="range" id="whitenTolerance" min="10" max="120" value="55" class="w-24 accent-amber-500 h-1">
                        <span id="whitenTolVal" class="text-[10px] text-amber-400 font-bold w-6 text-right">55</span>
                    </div>
                </div>

                <div class="pt-3 border-t border-slate-800 space-y-2 text-slate-400">
                    <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">दस्तावेज़ स्थिति</div>
                    <div class="flex justify-between"><span>कैनवास:</span><span id="lblCanvasDim" class="text-slate-200 font-mono">-</span></div>
                    <div class="flex justify-between"><span>ज़ूम:</span><span id="lblZoomLevel" class="text-slate-200 font-mono">100%</span></div>
                </div>
            </div>
        </aside>
    </div>

    <footer class="h-6 bg-[#121418] border-t border-slate-800 flex items-center justify-between px-3 text-[11px] text-slate-400 shrink-0 z-50">
        <div class="flex items-center gap-3">
            <span id="statusMessage" class="text-slate-300"><i class="fa-solid fa-circle-check text-green-500 mr-1"></i> तैयार</span>
            <span class="text-slate-600">|</span>
            <span>Ctrl+Z: Undo | Ctrl+Shift+W: व्हाइट | Space+Drag: पैन</span>
        </div>
        <div class="flex items-center gap-3">
            <span id="mouseCoords" class="font-mono text-slate-400">X: 0, Y: 0</span>
            <span class="text-slate-600">|</span>
            <div class="flex items-center gap-1">
                <button onclick="changeZoom(-0.2)" class="hover:text-white px-1"><i class="fa-solid fa-minus"></i></button>
                <span id="statusZoom" class="font-mono text-slate-200 w-12 text-center">100%</span>
                <button onclick="changeZoom(0.2)" class="hover:text-white px-1"><i class="fa-solid fa-plus"></i></button>
            </div>
        </div>
    </footer>

    <script>
        let currentTool = 'select';
        let currentScale = 1.0;
        let panX = 50, panY = 40;
        let isPanning = false;
        let panStartX = 0, panStartY = 0;
        let isSpacePressed = false;

        const masterCanvas = document.getElementById('masterCanvas');
        const masterCtx = masterCanvas.getContext('2d', { willReadFrequently: true });
        let pagesArray = [];
        let currentPageIndex = 0;

        let fgColor = '#111827';
        let bgColor = '#ffffff';

        let useSampleStampPatch = false;
        let isPickingStampPatch = false;
        let stampPatchStart = null;
        let stampPatchPreview = null;
        let stampSamplePattern = null;
        let stampSampleData = null;
        let protectColorEnabled = false;
        let protectColor = '#000000';
        let protectTolerance = 35;

        const undoStack = [];
        const redoStack = [];
        const MAX_HISTORY = 25;

        let internalClipboardCanvas = null;
        let internalClipboardText = null;
        let internalClipboardDataUrl = null;
        let internalClipboardW = 0;
        let internalClipboardH = 0;
        let internalClipboardType = null;
        let copyTransparentBackground = true;

        let cloneSource = null;
        let isCloning = false;
        let cloneRadius = 5;
        let cloneOpacity = 80;
        let cloneOffset = { x: 0, y: 0 };

        let isEraserMode = false;
        let eraserType = 'brush';
        let eraserBrushSize = 5;
        let magicEraserMode = true;
        let magicEraserTolerance = 45;
        let magicEraserPass = 0;
        let magicEraserLastTarget = null;
        let blendEraserWithCanvas = false;
        let eraserBlendStrength = 85;
        let lastCanvasPoint = { x: 0, y: 0 };
        let isErasing = false;
        let eraserStart = null;
        let eraserLastPos = null;
        let eraserPreview = null;
        let eyeDropperModeTarget = null;
        let lastEraserArea = null;

        let activeTextElement = null;
        let textToolSize = 18;
        let textToolWeight = 400;
        let textToolSpacing = 0;
        let isDraggingText = false;
        let textDragOffset = { x: 0, y: 0 };

        let isMarqueeActive = false;
        let marqueeStart = { x: 0, y: 0 };
        let marqueeEnd = { x: 0, y: 0 };
        let marqueeDiv = null;
        let activePastedElem = null;
        let currentSelection = null;

        function closeAllColorPickers() {
            document.querySelectorAll('input[type="color"]').forEach(inp => {
                try { inp.blur(); } catch(e) {}
            });
            if (document.activeElement && document.activeElement.tagName === 'INPUT' &&
                document.activeElement.type === 'color') {
                try { document.activeElement.blur(); } catch(e) {}
            }
        }

        // ⭐⭐⭐ नया: साइडबार के नीचे वाले रंग-बॉक्स से "न मिटने वाला रंग" सेट करें ⭐⭐⭐
        function updateProtectColorFromSidebar(hex) {
            protectColor = hex;
            protectColorEnabled = true;
            // टॉप बार और टूलबार में मौजूद चेकबॉक्स/इनपुट को सिंक करें
            const chk = document.getElementById('chkProtectColor');
            if (chk) chk.checked = true;
            const direct = document.getElementById('protectColorDirect');
            if (direct) direct.value = hex;
            renderTopOptionsBar(currentTool);
            showToast(`🛡️ न मिटने वाला रंग: ${hex} ✓ (यह रंग कभी नहीं मिटेगा)`);
            closeAllColorPickers();
        }

        window.addEventListener('DOMContentLoaded', () => {
            initDefaultCanvas();
            setupSmoothPanAndZoom();
            setupKeyboardShortcuts();
            renderTopOptionsBar('select');
            initCanvasInteractionListeners();
            const tol = document.getElementById('whitenTolerance');
            if (tol) tol.addEventListener('input', () => {
                document.getElementById('whitenTolVal').innerText = tol.value;
            });

            document.addEventListener('pointerdown', (e) => {
                const t = e.target;
                if (!t) return;
                if (t.type === 'color') return;
                if (t.closest && t.closest('input[type="color"]')) return;
                closeAllColorPickers();
            }, true);

            document.querySelectorAll('input[type="color"]').forEach(inp => {
                inp.addEventListener('change', () => { setTimeout(() => inp.blur(), 0); });
            });
        });

        function initDefaultCanvas() {
            masterCanvas.width = 1240;
            masterCanvas.height = 1754;
            masterCtx.fillStyle = '#ffffff';
            masterCtx.fillRect(0, 0, masterCanvas.width, masterCanvas.height);
            undoStack.length = 0;
            redoStack.length = 0;
            saveUndoState();
            fitToScreen();
            updateDimensionLabel();
        }

        function updateDimensionLabel() {
            const lbl = document.getElementById('lblCanvasDim');
            if (lbl && masterCanvas) lbl.innerText = `${masterCanvas.width} × ${masterCanvas.height} px`;
        }

        function setupSmoothPanAndZoom() {
            const viewport = document.getElementById('mainViewport');
            viewport.addEventListener('wheel', (e) => {
                e.preventDefault();
                if (e.ctrlKey) {
                    const zoomDelta = e.deltaY < 0 ? (currentScale < 2 ? 0.2 : currentScale * 0.15) : (currentScale < 2 ? -0.2 : -currentScale * 0.15);
                    applyZoomAtPoint(zoomDelta, e.clientX, e.clientY);
                } else {
                    panY -= e.deltaY;
                    if (e.shiftKey) panX -= e.deltaY;
                    else panX -= e.deltaX;
                    updateCanvasTransform();
                }
            }, { passive: false });

            viewport.addEventListener('mousedown', (e) => {
                if (e.button === 1 || isSpacePressed || currentTool === 'pan') {
                    e.preventDefault();
                    isPanning = true;
                    panStartX = e.clientX - panX;
                    panStartY = e.clientY - panY;
                    viewport.style.cursor = 'grabbing';
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (isPanning) {
                    panX = e.clientX - panStartX;
                    panY = e.clientY - panStartY;
                    updateCanvasTransform();
                }
                updateCoordinatesDisplay(e);
            });

            window.addEventListener('mouseup', () => {
                if (isPanning) {
                    isPanning = false;
                    viewport.style.cursor = isSpacePressed ? 'grab' : (currentTool === 'pan' ? 'grab' : 'default');
                }
            });
        }

        function updateCanvasTransform() {
            const layer = document.getElementById('canvasTransformLayer');
            layer.style.transform = `translate(${panX}px, ${panY}px) scale(${currentScale})`;
            updateZoomDisplay();
        }

        function applyZoomAtPoint(delta, clientX, clientY) {
            const oldScale = currentScale;
            let newScale = Math.min(Math.max(0.15, currentScale + delta), 30.0);
            const viewport = document.getElementById('mainViewport');
            const rect = viewport.getBoundingClientRect();
            const mouseX = clientX - rect.left;
            const mouseY = clientY - rect.top;
            panX = mouseX - (mouseX - panX) * (newScale / oldScale);
            panY = mouseY - (mouseY - panY) * (newScale / oldScale);
            currentScale = newScale;
            updateCanvasTransform();
        }

        function changeZoom(val) {
            const vp = document.getElementById('mainViewport');
            const r = vp.getBoundingClientRect();
            const delta = currentScale > 2 ? val * (currentScale * 0.5) : val;
            applyZoomAtPoint(delta, r.left + r.width / 2, r.top + r.height / 2);
        }

        function resetZoom() {
            currentScale = 1.0;
            const vp = document.getElementById('mainViewport');
            panX = Math.max(20, (vp.clientWidth - masterCanvas.width) / 2);
            panY = 30;
            updateCanvasTransform();
        }

        function fitToScreen() {
            const vp = document.getElementById('mainViewport');
            const margin = 40;
            const scaleX = (vp.clientWidth - margin) / masterCanvas.width;
            const scaleY = (vp.clientHeight - margin) / masterCanvas.height;
            currentScale = Math.min(scaleX, scaleY, 1.2);
            panX = (vp.clientWidth - masterCanvas.width * currentScale) / 2;
            panY = (vp.clientHeight - masterCanvas.height * currentScale) / 2;
            updateCanvasTransform();
        }

        function fitToWidth() {
            const vp = document.getElementById('mainViewport');
            const margin = 40;
            currentScale = (vp.clientWidth - margin) / masterCanvas.width;
            panX = margin / 2;
            panY = 30;
            updateCanvasTransform();
        }

        function updateZoomDisplay() {
            const pct = Math.round(currentScale * 100) + '%';
            document.getElementById('statusZoom').innerText = pct;
            document.getElementById('lblZoomLevel').innerText = pct;
        }

        function getCanvasNativeCoordinates(clientX, clientY) {
            const rect = masterCanvas.getBoundingClientRect();
            return {
                x: Math.round((clientX - rect.left) / currentScale),
                y: Math.round((clientY - rect.top) / currentScale)
            };
        }

        function updateCoordinatesDisplay(e) {
            const coords = getCanvasNativeCoordinates(e.clientX, e.clientY);
            if (coords.x >= 0 && coords.x <= masterCanvas.width && coords.y >= 0 && coords.y <= masterCanvas.height) {
                document.getElementById('mouseCoords').innerText = `X: ${coords.x}, Y: ${coords.y}`;
            }
        }

        function setActiveTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            const btn = document.getElementById(`tool-${tool}`);
            if (btn) btn.classList.add('active');

            const vp = document.getElementById('mainViewport');
            if (tool !== 'eraser') toggleEraserTool(false);
            if (tool !== 'clone') hideCloneCursor();

            if (tool === 'pan') vp.style.cursor = 'grab';
            else if (tool === 'clone') vp.style.cursor = 'crosshair';
            else if (tool === 'eraser') toggleEraserTool(true);
            else if (tool === 'text') vp.style.cursor = 'text';
            else if (tool === 'marquee') vp.style.cursor = 'crosshair';
            else vp.style.cursor = 'default';

            renderTopOptionsBar(tool);
            showStatus(`सक्रिय टूल: ${tool.toUpperCase()}`);
        }

        function getRotationToolbarHTML() {
            const curRot = getSelectedRotation();
            return `
                <div class="flex items-center gap-1 bg-[#181a1f] px-1.5 py-0.5 rounded border border-sky-700 shrink-0" title="घुमाएँ">
                    <i class="fa-solid fa-rotate text-sky-400 text-[10px]"></i>
                    <button onclick="rotateSelectedObject(-90)" class="sub-bar-btn !px-1 !py-0.5 text-[10px]">-90°</button>
                    <input id="objectRotationSlider" type="range" min="-180" max="180" value="${curRot}" oninput="setSelectedRotation(this.value)" class="w-14 accent-sky-500 h-1">
                    <input id="objectRotationInput" type="number" min="-180" max="180" value="${curRot}" oninput="setSelectedRotation(this.value)" class="w-10 h-5 px-1 bg-[#121418] border border-slate-600 rounded text-[10px] text-sky-300 font-bold text-center">
                    <button onclick="rotateSelectedObject(90)" class="sub-bar-btn !px-1 !py-0.5 text-[10px]">+90°</button>
                    <button onclick="setSelectedRotation(0)" class="sub-bar-btn !px-1 !py-0.5 text-amber-400 text-[10px]">0°</button>
                </div>
            `;
        }

        function renderTopOptionsBar(tool) {
            const bar = document.getElementById('topOptionsBar');
            bar.innerHTML = '';
            const group = document.createElement('div');
            group.className = 'flex items-center gap-2 w-max flex-nowrap shrink-0 py-0.5';

            if (tool === 'select') {
                group.innerHTML = `
                    <span class="text-sky-400 font-bold flex items-center gap-1 shrink-0"><i class="fa-solid fa-arrow-pointer"></i> चयन:</span>
                    <span class="text-slate-400 text-[11px] shrink-0">ऑब्जेक्ट्स या शब्दों को स्थानांतरित करें।</span>
                    ${getRotationToolbarHTML()}
                `;
            } else if (tool === 'pan') {
                group.innerHTML = `
                    <span class="text-sky-400 font-bold flex items-center gap-1 shrink-0"><i class="fa-solid fa-hand"></i> पैन:</span>
                    <span class="text-slate-400 text-[11px] shrink-0">माउस खींचकर पेज खिसकाएँ।</span>
                    <button onclick="fitToScreen()" class="sub-bar-btn shrink-0"><i class="fa-solid fa-compress"></i> स्क्रीन फिट</button>
                    <button onclick="resetZoom()" class="sub-bar-btn shrink-0"><i class="fa-solid fa-expand"></i> 100%</button>
                `;
            } else if (tool === 'marquee') {
                group.innerHTML = `
                    <span class="text-sky-400 font-bold flex items-center gap-1 shrink-0"><i class="fa-regular fa-square"></i> मार्की:</span>
                    <button onclick="copyCurrentSelection()" class="sub-bar-btn shrink-0"><i class="fa-solid fa-copy"></i> कॉपी</button>
                    <button onclick="cutCurrentSelection()" class="sub-bar-btn shrink-0"><i class="fa-solid fa-scissors"></i> कट</button>
                    <button onclick="pasteFromClipboard()" class="sub-bar-btn shrink-0"><i class="fa-solid fa-paste"></i> पेस्ट</button>
                    <label class="flex items-center gap-1 text-[11px] font-bold cursor-pointer px-2 py-0.5 rounded border bg-sky-950/60 text-sky-300 border-sky-600 shrink-0">
                        <input type="checkbox" id="chkCopyTransparent" ${copyTransparentBackground ? 'checked' : ''} onchange="toggleCopyTransparent(this.checked)" class="accent-sky-500 w-3.5 h-3.5">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> पारदर्शी
                    </label>
                    <button onclick="whitenSelectionOnly()" class="sub-bar-btn shrink-0 bg-amber-700 border-amber-500 text-amber-50"><i class="fa-solid fa-fill-drip"></i> इस हिस्से को व्हाइट</button>
                    ${getRotationToolbarHTML()}
                `;
            } else if (tool === 'clone') {
                group.innerHTML = `
                    <span class="text-sky-400 font-bold flex items-center gap-1 shrink-0"><i class="fa-solid fa-stamp"></i> क्लोन:</span>
                    <div class="flex items-center gap-1 bg-[#181a1f] px-2 py-0.5 rounded border border-slate-700 shrink-0">
                        <span class="text-[10px] text-slate-400">आकार:</span>
                        <input type="range" min="1" max="150" value="${cloneRadius}" oninput="updateCloneRadius(this.value)" class="w-16 accent-sky-500 h-1">
                        <span id="cloneRadiusVal" class="font-bold text-[10px] text-sky-400">${cloneRadius}px</span>
                    </div>
                    <span class="text-amber-400 text-[11px] shrink-0"><i class="fa-solid fa-circle-info"></i> <b>Alt + क्लिक</b> से स्रोत चुनें</span>
                `;
            } else if (tool === 'eraser') {
                group.innerHTML = `
                    <span class="text-pink-400 font-bold flex items-center gap-1 shrink-0"><i class="fa-solid fa-eraser"></i> रबर:</span>
                    <div class="flex items-center bg-[#181a1f] p-0.5 rounded border border-slate-700 shrink-0">
                        <button onclick="setEraserType('brush')" class="px-1.5 py-0.5 rounded text-[10px] font-bold ${eraserType === 'brush' ? 'bg-pink-600 text-white' : 'text-slate-400'}">ब्रश</button>
                        <button onclick="setEraserType('box')" class="px-1.5 py-0.5 rounded text-[10px] font-bold ${eraserType === 'box' ? 'bg-pink-600 text-white' : 'text-slate-400'}">बॉक्स</button>
                    </div>
                    <div class="flex items-center gap-1 bg-[#181a1f] px-1.5 py-0.5 rounded border border-slate-700 shrink-0">
                        <span class="text-[10px] text-slate-400">साइज:</span>
                        <input type="range" min="1" max="150" value="${eraserBrushSize}" oninput="updateEraserBrushSize(this.value)" class="w-14 accent-pink-500 h-1">
                        <span id="eraserSizeVal" class="font-bold text-[10px] text-pink-400">${eraserBrushSize}px</span>
                    </div>
                    <label class="flex items-center gap-1 text-[10px] font-bold cursor-pointer px-1.5 py-0.5 rounded border shrink-0 ${magicEraserMode ? 'bg-amber-600 text-white' : 'bg-slate-800 text-slate-300 border-slate-600'}">
                        <input type="checkbox" ${magicEraserMode ? 'checked' : ''} onchange="toggleMagicEraser(this.checked)" class="accent-amber-500 w-3 h-3">
                        <span>मैजिक रबर</span>
                    </label>
                    <div class="flex items-center gap-1.5 bg-[#181a1f] px-1.5 py-0.5 rounded border border-amber-700 shrink-0">
                        <span class="text-[10px] text-amber-400 font-bold">मिटाने वाला रंग:</span>
                        <input type="color" id="eraserTargetColorDirect" value="${fgColor}" onchange="setMagicInkColorDirect(this.value)" class="w-4 h-4 p-0 border-0 rounded cursor-pointer">
                        <button onclick="startInstantEyedropper('fg')" class="sub-bar-btn !px-1 !py-0.5 text-[10px]">पिक</button>
                        <div class="h-3.5 w-[1px] bg-slate-700 mx-0.5"></div>
                        <label class="flex items-center gap-1 cursor-pointer text-[10px] font-bold text-sky-300 hover:text-white">
                            <input type="checkbox" id="chkSamplePatch" ${useSampleStampPatch ? 'checked' : ''} onchange="toggleSampleStampPatch(this.checked)" class="accent-sky-500 w-3 h-3">
                            <span>सैंपल पैच</span>
                        </label>
                        <button onclick="pickStampPatchArea()" class="sub-bar-btn !px-1.5 !py-0.5 text-[10px] bg-sky-900 border-sky-600 text-sky-200">
                            <i class="fa-solid fa-crop-simple"></i> पैच
                        </button>
                    </div>
                    <div class="flex items-center gap-1.5 bg-[#181a1f] px-1.5 py-0.5 rounded border border-red-700 shrink-0">
                        <label class="flex items-center gap-1 cursor-pointer text-[10px] font-bold text-red-400">
                            <input type="checkbox" id="chkProtectColor" ${protectColorEnabled ? 'checked' : ''} onchange="toggleProtectColor(this.checked)" class="accent-red-500 w-3 h-3">
                            <span>न मिटने वाला रंग:</span>
                        </label>
                        <input type="color" id="protectColorDirect" value="${protectColor}" onchange="setProtectColorDirect(this.value)" class="w-4 h-4 p-0 border-0 rounded cursor-pointer">
                        <button onclick="startInstantEyedropper('protect')" class="sub-bar-btn !px-1 !py-0.5 text-[10px]">पिक</button>
                    </div>
                    <div class="flex items-center gap-1 bg-[#181a1f] px-1.5 py-0.5 rounded border border-violet-700 shrink-0">
                        <span class="text-[10px] text-violet-300 font-bold">गहराई:</span>
                        <input type="range" min="1" max="120" value="${magicEraserTolerance}" oninput="updateMagicEraserTolerance(this.value)" class="w-14 accent-violet-500 h-1">
                        <span id="magicToleranceVal" class="font-bold text-[10px] text-violet-300">${magicEraserTolerance}</span>
                    </div>
                    <label class="flex items-center gap-1 bg-emerald-900/40 text-emerald-200 px-1.5 py-0.5 rounded border border-emerald-700 cursor-pointer text-[10px] shrink-0">
                        <input type="checkbox" ${blendEraserWithCanvas ? 'checked' : ''} onchange="toggleEraserCanvasBlend(this.checked)" class="accent-emerald-500 w-3 h-3">
                        <span>बैकग्राउंड मिलाएँ</span>
                    </label>
                    <div class="flex items-center gap-1 bg-[#181a1f] px-1.5 py-0.5 rounded border border-emerald-700 shrink-0">
                        <span class="text-[10px] text-emerald-400 font-bold">सफ़ेद:</span>
                        <input type="color" id="eraserColorDirect" value="${bgColor}" onchange="setEraserColorDirect(this.value)" class="w-4 h-4 p-0 border-0 rounded cursor-pointer">

        // ⭐ सुधरा हुआ — साइडबार के नीचे वाले बॉक्स को भी सिंक करेगा

        function getSelectedObject() { return activeTextElement || activePastedElem; }
        function getSelectedRotation() {
            const el = getSelectedObject();

        function setSelectedRotation(deg) {
            const el = getSelectedObject(); if (!el) return;
            const parsed = parseInt(deg, 10);
            const rotation = Math.max(-180, Math.min(180, Number.isFinite(parsed) ? parsed : 0));
            el.dataset.rotation = String(rotation);
            el.style.transform = `rotate(${rotation}deg)`;
            const slider = document.getElementById('objectRotationSlider');

        function setupKeyboardShortcuts() {
            window.addEventListener('keydown', (e) => {
                const isTyping = e.target.isContentEditable ||
                                 e.target.tagName === 'INPUT' ||
                                 e.target.tagName === 'SELECT' ||
                                 e.target.tagName === 'TEXTAREA';

                if (e.code === 'Space' && !isTyping) {
                    e.preventDefault();
                    if (!isSpacePressed) {
                        isSpacePressed = true;
                        document.getElementById('mainViewport').style.cursor = 'grab';
                    }
                    return;
                }

                const isEditingNow = document.activeElement && document.activeElement.classList &&
                                     document.activeElement.classList.contains('editing');

                if (!e.ctrlKey && !e.altKey && !e.metaKey && !isEditingNow && getSelectedObject() &&
                    ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
                    moveSelectedObjectByKeyboard(e.key, e.shiftKey ? 10 : 1);
                    e.preventDefault();
                    return;
                }

                if (isTyping) return;

                if (e.ctrlKey || e.metaKey) {
                    const k = e.key.toLowerCase();
                    if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
                    if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); redo(); return; }
                    if (k === 'c') { e.preventDefault(); copyCurrentSelection(); return; }
                    if (k === 'x') { e.preventDefault(); cutCurrentSelection(); return; }
                    if (k === 'v') { e.preventDefault(); pasteFromClipboard(); return; }
                    if (k === 'a') { e.preventDefault(); selectAllCanvas(); return; }
                    if (k === 'd') { e.preventDefault(); deselectAllObjects(); removeMarqueeDiv(); return; }
                    if (k === 'p') { e.preventDefault(); printCurrentPage(); return; }
                    if (k === 's') { e.preventDefault(); exportWithOptions(); return; }
                    if (k === 'o') { e.preventDefault(); document.getElementById('mainFileInput').click(); return; }
                    if (k === 'w' && e.shiftKey) { e.preventDefault(); whitenBackground(); return; }
                    if (k === '0') { e.preventDefault(); fitToScreen(); return; }
                    if (k === '1') { e.preventDefault(); resetZoom(); return; }
                    if (k === '=' || k === '+') { e.preventDefault(); changeZoom(0.2); return; }
                    if (k === '-') { e.preventDefault(); changeZoom(-0.2); return; }
                    return;
                }

                if (e.key === 'Delete' || e.key === 'Backspace') {
                    e.preventDefault(); deleteSelected(); return;
                }

                if (e.key === 'Escape') {
                    closeAllColorPickers();
                    deselectAllObjects(); removeMarqueeDiv();
                    if (typeof isPickingStampPatch !== 'undefined') isPickingStampPatch = false;
                    if (typeof eyeDropperModeTarget !== 'undefined') eyeDropperModeTarget = null;
                    document.getElementById('mainViewport').style.cursor = 'default';
                    return;
                }

                if (e.altKey) return;

                switch (e.key.toLowerCase()) {
                    case 'v': setActiveTool('select');  break;
                    case 'h': setActiveTool('pan');     break;
                    case 'm': setActiveTool('marquee'); break;
                    case 's': setActiveTool('clone');   break;
                    case 'e': setActiveTool('eraser');  break;
                    case 't': setActiveTool('text');    break;
                }
            });

            window.addEventListener('keyup', (e) => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    isSpacePressed = false;
                    const vp = document.getElementById('mainViewport');
                    vp.style.cursor = currentTool === 'pan' ? 'grab'
                                    : currentTool === 'eraser' ? 'crosshair'
                                    : currentTool === 'clone' ? 'crosshair'
                                    : currentTool === 'text' ? 'text'
                                    : 'default';
                }
            });
        }

        function selectAllCanvas() {
            currentSelection = { x: 0, y: 0, w: masterCanvas.width, h: masterCanvas.height };
            removeMarqueeDiv();
            const container = document.getElementById('fullScreenCanvasContainer');
            marqueeDiv = document.createElement('div');
            marqueeDiv.style.position = 'absolute';
            marqueeDiv.style.border = '1.5px dashed #38bdf8';

            marqueeDiv.style.pointerEvents = 'none';
            marqueeDiv.style.zIndex = '999';
            marqueeDiv.style.left = '0%'; marqueeDiv.style.top = '0%';
            marqueeDiv.style.width = '100%'; marqueeDiv.style.height = '100%';
            container.appendChild(marqueeDiv);
            showToast('पूरा पेज चुना गया ✓');
