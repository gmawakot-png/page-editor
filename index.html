        function resetStampSource() {
            stampSourcePoint = null;
            showToast("नया सोर्स चुनने के लिए Alt + Click करें");
        }

        function updateStampBrushSize() {
            stampBrushSize = parseInt(document.getElementById('stampSizeRange').value) || 40;
            const l = document.getElementById('stampSizeVal');
            if (l) l.innerText = `${stampBrushSize}px`;
        }

        function updateStampSoftness() {
            stampSoftness = parseInt(document.getElementById('stampSoftRange').value) || 35;
            const l = document.getElementById('stampSoftVal');
            if (l) l.innerText = `${stampSoftness}%`;
        }

        function initStampCanvasListeners() {
            if (!masterCanvas) return;
            masterCanvas.addEventListener('mousedown', function(e) {
                if (!isStampMode || isSpacePressed) return;
                const pos = getCanvasNativeCoordinates(e.clientX, e.clientY);

                if (e.altKey || !stampSourcePoint) {
                    stampSourcePoint = pos;
                    showToast("स्टैंप सोर्स सेट हो गया ✓ अब शब्द पर पेंट करें");
                    return;
                }

                isStampPainting = true;
                stampOffsetX = pos.x - stampSourcePoint.x;
                stampOffsetY = pos.y - stampSourcePoint.y;
                saveUndoState();
                paintStampAt(pos);
            });
        }

        window.addEventListener('mousemove', (e) => {
            if (isStampMode && masterCanvas) {
                const pos = getCanvasNativeCoordinates(e.clientX, e.clientY);
                updateStampCursorPreview(pos);
                if (isStampPainting) paintStampAt(pos);
            }
        });

        window.addEventListener('mouseup', () => {
            if (isStampMode && isStampPainting) {
                isStampPainting = false;
                saveCurrentPageInMemory();
            }
        });

        function paintStampAt(pos) {
            if (!stampSourcePoint || !masterCanvas) return;
            const srcX = pos.x - stampOffsetX;
            const srcY = pos.y - stampOffsetY;
            const r = stampBrushSize / 2;
            const feather = Math.max(0, Math.min(r - 1, r * (stampSoftness / 100)));
            const size = Math.ceil(r * 2);

            const off = document.createElement('canvas');
            off.width = size; off.height = size;
            const octx = off.getContext('2d');
            octx.drawImage(masterCanvas, srcX - r, srcY - r, size, size, 0, 0, size, size);

            const maskCanvas = document.createElement('canvas');
            maskCanvas.width = size; maskCanvas.height = size;
            const mctx = maskCanvas.getContext('2d');
            const grad = mctx.createRadialGradient(size / 2, size / 2, Math.max(0, r - feather), size / 2, size / 2, r);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            mctx.fillStyle = grad;
            mctx.beginPath();
            mctx.arc(size / 2, size / 2, r, 0, Math.PI * 2);
            mctx.fill();

            octx.globalCompositeOperation = 'destination-in';
            octx.drawImage(maskCanvas, 0, 0);
            masterCtx.drawImage(off, pos.x - r, pos.y - r);
        }

        function updateStampCursorPreview(pos) {
            if (!masterCanvas) return;
            if (!stampCursorPreview) {
                stampCursorPreview = document.createElement('div');
                stampCursorPreview.className = 'editor-eraser-preview';
                stampCursorPreview.style.background = 'rgba(139, 92, 246, 0.2)';
                stampCursorPreview.style.border = '2px dashed #7c3aed';
                stampCursorPreview.style.borderRadius = '50%';
                document.getElementById('fullScreenCanvasContainer').appendChild(stampCursorPreview);

            const r = stampBrushSize / 2;
            stampCursorPreview.style.left = `${((pos.x - r) / masterCanvas.width) * 100}%`;
            stampCursorPreview.style.top = `${((pos.y - r) / masterCanvas.height) * 100}%`;
            stampCursorPreview.style.width = `${(stampBrushSize / masterCanvas.width) * 100}%`;
            stampCursorPreview.style.height = `${(stampBrushSize / masterCanvas.height) * 100}%`;
            stampCursorPreview.style.display = isStampMode ? 'block' : 'none';
        }

        function removeStampCursorPreview() {

        /* ZOOM ENGINE */

        /* ========================================================
           MOVE / COPY / CUT / PASTE ENGINE
           (AUTONOMOUS TRANSPARENT INK KNOCKOUT - NO DARK BOX)
           ======================================================== */
        let moveMode = false, moveSelecting = false, moveStart = null, moveRect = null, moveClipboard = null;
        let activePastedElem = null, activePastedData = null;

        function setMoveMode(on) {
            moveMode = !!on;
            const wrap = document.getElementById('fullScreenCanvasContainer');
            if (wrap) wrap.classList.toggle('move-mode-active', moveMode);

            if (moveMode) {
                if (activePastedElem) activePastedElem.style.pointerEvents = 'auto';

            } else {

        }

        function clearMoveSelection() {
            const box = document.getElementById('moveSelectionBox');
            if (box) box.remove();
            moveRect = null;
        }

        function ensureMoveBox() {
            let box = document.getElementById('moveSelectionBox');
            if (box) return box;
            box = document.createElement('div');
            box.id = 'moveSelectionBox';
            box.style.cssText = 'position:absolute;display:none;z-index:9999;border:1px dashed #2563eb;pointer-events:none;';
            document.getElementById('fullScreenCanvasContainer').appendChild(box);

        }

        function showMoveBox(rect) {
            const box = ensureMoveBox();
            if (!box || !masterCanvas) return;
            const sx = masterCanvas.offsetWidth / masterCanvas.width;
            const sy = masterCanvas.offsetHeight / masterCanvas.height;

        /**
         * ALPHA KNOCKOUT ENGINE:
         * यह फंक्शन शब्द के आसपास के सारे ग्रे/व्हाइट कागज़ को 100% पारदर्शी (Transparent) बनाता है।
         * जिससे सिर्फ काले/नीले शब्द (Ink) की लेयर बनती है और कोई डार्क बक्सा नहीं आता!
         */
        function createTransparentInkCanvas(srcCanvas, tolerance = 25) {
            const w = srcCanvas.width, h = srcCanvas.height;
            const out = document.createElement('canvas');
            out.width = w; out.height = h;
            const octx = out.getContext('2d');
            octx.drawImage(srcCanvas, 0, 0);
            
            const imgData = octx.getImageData(0, 0, w, h);
            const d = imgData.data;

            // 1. क्रॉप के किनारों (Borders) से कागज़ के औसत रंग का सटीक पता लगाना
            let paperR = 0, paperG = 0, paperB = 0, pCount = 0;
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const isBorder = (x < 3 || x >= w - 3 || y < 3 || y >= h - 3);
                    if (isBorder) {
                        const idx = (y * w + x) * 4;
                        paperR += d[idx];
                        paperG += d[idx + 1];
                        paperB += d[idx + 2];
                        pCount++;
                    }
                }
            }
            if (pCount > 0) {
                paperR /= pCount; paperG /= pCount; paperB /= pCount;
            } else {
                paperR = 210; paperG = 210; paperB = 210;
            }
            const paperLum = 0.299 * paperR + 0.587 * paperG + 0.114 * paperB;

            // 2. कटऑफ निर्धारित करना ताकि सिर्फ स्याही (Ink) बचे और कागज़ गायब हो जाए
            const cutoffHigh = paperLum - (tolerance * 0.35);
            const cutoffLow = Math.max(0, paperLum - (tolerance * 2.2));

            for (let i = 0; i < d.length; i += 4) {
                const r = d[i], g = d[i + 1], b = d[i + 2];
                const lum = 0.299 * r + 0.587 * g + 0.114 * b;

                if (lum >= cutoffHigh) {
                    // यह कागज़ है -> पूर्णतः पारदर्शी (Alpha = 0)
                    d[i + 3] = 0;
                } else if (lum <= cutoffLow) {
                    // यह वास्तविक लिखावट (Ink) है -> 100% दिखने योग्य
                    d[i + 3] = 255;
                } else {
                    // अक्षरों के किनारों का स्मूथ एंटी-अलियासिंग ग्रेडिएंट
                    const factor = (cutoffHigh - lum) / (cutoffHigh - cutoffLow);
                    d[i + 3] = Math.round(factor * 255);
                }
            }

            octx.putImageData(imgData, 0, 0);
            return out;
        }

        function copyMoveSelection() {
            if (!moveRect || moveRect.w < 2 || moveRect.h < 2 || !masterCanvas) {
                showToast("पहले माउस से एरिया चुनें!");
                return false;
            }
            const temp = document.createElement('canvas');
            temp.width = Math.round(moveRect.w); temp.height = Math.round(moveRect.h);
            temp.getContext('2d').drawImage(masterCanvas, moveRect.x, moveRect.y, temp.width, temp.height, 0, 0, temp.width, temp.height);
            
            moveClipboard = { 
                rawCanvas: temp, 
                w: temp.width, 
                h: temp.height 
            };
            clearMoveSelection();
            showToast("कॉपी हो गया! अब Paste पर क्लिक करें");
            return true;
        }

        function cutMoveSelection() {
            if (!moveRect || moveRect.w < 2 || moveRect.h < 2 || !masterCanvas) {
                showToast("पहले माउस से एरिया चुनें!");
                return false;
            }
            saveUndoState();
            const temp = document.createElement('canvas');
            temp.width = Math.round(moveRect.w); temp.height = Math.round(moveRect.h);
            temp.getContext('2d').drawImage(masterCanvas, moveRect.x, moveRect.y, temp.width, temp.height, 0, 0, temp.width, temp.height);
            
            moveClipboard = { 
                rawCanvas: temp, 
                w: temp.width, 
                h: temp.height 
            };
            
            const autoPaper = document.getElementById('moveAutoBgToggle')?.checked ?? true;
            let fillColor = '#ffffff';
            if (autoPaper) {
                fillColor = getSurroundingPaperColor(moveRect.x, moveRect.y, moveRect.w, moveRect.h);
            } else {
                fillColor = document.getElementById('eraserColor')?.value || '#ffffff';
            }

            masterCtx.save();
            masterCtx.fillStyle = fillColor;
            masterCtx.fillRect(moveRect.x, moveRect.y, temp.width, temp.height);
            masterCtx.restore();

            document.querySelectorAll('.seamless-text-item').forEach(el => {
                const lx = parseFloat(el.dataset.canvasX) || 0;
                const ly = parseFloat(el.dataset.canvasY) || 0;
                if (lx >= moveRect.x && lx <= moveRect.x + moveRect.w && ly >= moveRect.y && ly <= moveRect.y + moveRect.h) {
                    el.remove();
                }
            });

            saveCurrentPageInMemory();
            clearMoveSelection();
            showToast("कट हो गया! (कागज़ के रंग से मैच किया गया)");
            return true;
        }

        function pasteMoveSelection() {
            if (!moveClipboard) return showToast("पहले एरिया Copy या Cut करें!");
            const p = lastClickCanvasPos || { x: 50, y: 50 };
            pasteMoveSelectionAt(p.x, p.y);
        }

        function updatePastedTolerance(val) {
            const label = document.getElementById('pasteToleranceVal');
            if (label) label.innerText = val;
            if (!moveClipboard || !moveClipboard.rawCanvas) return;
            
            const isTrans = document.getElementById('pasteTransparentToggle')?.checked ?? true;
            if (activePastedData) {
                if (isTrans) {
                    activePastedData.canvas = createTransparentInkCanvas(moveClipboard.rawCanvas, parseInt(val) || 25);
                } else {
                    activePastedData.canvas = cloneCanvas(moveClipboard.rawCanvas);
                }
                
                if (activePastedElem) {
                    const c = activePastedElem.querySelector('canvas');
                    if (c) {
                        const ctx = c.getContext('2d');
                        ctx.clearRect(0, 0, c.width, c.height);
                        ctx.drawImage(activePastedData.canvas, 0, 0);
                    }
                }
            }
        }

        function updatePastedTransparency() {
            const val = document.getElementById('pasteToleranceRange')?.value || 25;
            updatePastedTolerance(val);
        }

        function pasteMoveSelectionAt(x, y) {
            if (!moveClipboard || !masterCanvas) return;
            if (activePastedData) commitActivePastedObject();
            saveUndoState();

            const isTrans = (document.getElementById('pasteTransparentToggle')?.checked ?? true);
            const tolerance = parseInt(document.getElementById('pasteToleranceRange')?.value || 25);

            let renderCanvas = null;
            if (isTrans) {
                renderCanvas = createTransparentInkCanvas(moveClipboard.rawCanvas, tolerance);
            } else {
                renderCanvas = cloneCanvas(moveClipboard.rawCanvas);
            }

            activePastedData = {
                canvas: renderCanvas,
                x: Math.max(0, Math.min(masterCanvas.width - moveClipboard.w, Math.round(x))),
                y: Math.max(0, Math.min(masterCanvas.height - moveClipboard.h, Math.round(y))),
                w: moveClipboard.w,
                h: moveClipboard.h,
                rotation: 0,
                isTransparent: isTrans
            };
            createFloatingPastedDOM();
            clearMoveSelection();
            showToast("पेस्ट हो गया! डार्क बॉक्स हटाकर पारदर्शी इंक सेट की गई");
        }

        function ensurePasteLayers() {
            if (!pagesData[currentPageIndex]) return [];
            if (!pagesData[currentPageIndex].pasteLayers) pagesData[currentPageIndex].pasteLayers = [];
            return pagesData[currentPageIndex].pasteLayers;
        }

        function commitActivePastedObject() {
            if (!activePastedData || !masterCanvas || !masterCtx) return;
            const rot = activePastedData.rotation || 0;
            const ax = Math.round(activePastedData.x);
            const ay = Math.round(activePastedData.y);
            const aw = activePastedData.w;
            const ah = activePastedData.h;

            // Snapshot UNDER pixels BEFORE drawing paste — exact restore on reselect
            let underDataUrl = null;
            try {
                const pad = 2;
                const sx = Math.max(0, ax - pad);
                const sy = Math.max(0, ay - pad);
                const sw = Math.min(masterCanvas.width - sx, aw + pad * 2);
                const sh = Math.min(masterCanvas.height - sy, ah + pad * 2);
                const under = document.createElement('canvas');
                under.width = sw; under.height = sh;
                under.getContext('2d').drawImage(masterCanvas, sx, sy, sw, sh, 0, 0, sw, sh);
                underDataUrl = under.toDataURL('image/png');
                activePastedData._underMeta = { sx, sy, sw, sh };
            } catch (e) {}

            masterCtx.save();
            masterCtx.globalCompositeOperation = 'source-over';
            if (rot) {
                const cx = ax + aw / 2;
                const cy = ay + ah / 2;
                masterCtx.translate(cx, cy);
                masterCtx.rotate((rot * Math.PI) / 180);
                masterCtx.drawImage(activePastedData.canvas, -aw / 2, -ah / 2);
            } else {
                masterCtx.drawImage(activePastedData.canvas, ax, ay);
            }
            masterCtx.restore();

            try {
                const layers = ensurePasteLayers();
                layers.push({
                    x: ax, y: ay, w: aw, h: ah,
                    rotation: rot,
                    isTransparent: activePastedData.isTransparent,
                    dataUrl: activePastedData.canvas.toDataURL('image/png'),
                    underDataUrl: underDataUrl,
                    underMeta: activePastedData._underMeta || null
                });
            } catch (err) {}
            if (activePastedElem) { activePastedElem.remove(); activePastedElem = null; }
            activePastedData = null;
            saveCurrentPageInMemory();
        }

        /** Ctrl+Click: पहले से लॉक किए गए पेस्ट को फिर से उठाएं (बिना कोई सफेद/डार्क धब्बा छोड़े) */
        function tryReselectLockedPasteAt(canvasX, canvasY) {
            const layers = ensurePasteLayers();
            if (!layers.length || !masterCanvas) return false;
            for (let i = layers.length - 1; i >= 0; i--) {
                const L = layers[i];
                const rot = L.rotation || 0;
                let hit = false;
                if (!rot) {
                    hit = canvasX >= L.x && canvasX <= L.x + L.w && canvasY >= L.y && canvasY <= L.y + L.h;
                } else {
                    const cx = L.x + L.w / 2, cy = L.y + L.h / 2;
                    const rad = -rot * Math.PI / 180;
                    const dx = canvasX - cx, dy = canvasY - cy;
                    const lx = dx * Math.cos(rad) - dy * Math.sin(rad);
                    const ly = dx * Math.sin(rad) + dy * Math.cos(rad);
                    hit = Math.abs(lx) <= L.w / 2 && Math.abs(ly) <= L.h / 2;
                }
                if (!hit) continue;

                saveUndoState();

                // EXACT restore of under-pixels (no paper fill box, no background change)
                const restoreUnder = (cb) => {
                    if (L.underDataUrl && L.underMeta) {
                        const uimg = new Image();
                        uimg.onload = function() {
                            masterCtx.drawImage(uimg, L.underMeta.sx, L.underMeta.sy);
                            cb();
                        };
                        uimg.onerror = function() { cb(); };
                        uimg.src = L.underDataUrl;
                    } else {
                        // Fallback for old layers without under snapshot: alpha-masked paper only on ink pixels
                        const img2 = new Image();
                        img2.onload = function() {
                            const temp = document.createElement('canvas');
                            temp.width = L.w; temp.height = L.h;
                            const tctx = temp.getContext('2d');
                            tctx.drawImage(img2, 0, 0);
                            const src = tctx.getImageData(0, 0, L.w, L.h).data;
                            const bg = getSurroundingPaperColor(L.x, L.y, L.w, L.h);
                            const fill = parseColorToRGB(bg);
                            const sx = Math.max(0, Math.floor(L.x));
                            const sy = Math.max(0, Math.floor(L.y));
                            const sw = Math.min(masterCanvas.width - sx, L.w);
                            const sh = Math.min(masterCanvas.height - sy, L.h);
                            const cd = masterCtx.getImageData(sx, sy, sw, sh);
                            const d = cd.data;
                            for (let py = 0; py < sh; py++) {
                                for (let px = 0; px < sw; px++) {
                                    const a = src[(py * L.w + px) * 4 + 3];
                                    if (a < 12) continue;
                                    const di = (py * sw + px) * 4;
                                    const f = a / 255;
                                    d[di]     = Math.round(d[di]     * (1 - f) + fill.r * f);
                                    d[di + 1] = Math.round(d[di + 1] * (1 - f) + fill.g * f);
                                    d[di + 2] = Math.round(d[di + 2] * (1 - f) + fill.b * f);
                                }
                            }
                            masterCtx.putImageData(cd, sx, sy);
                            cb();
                        };
                        img2.onerror = function() { cb(); };
                        img2.src = L.dataUrl;
                    }
                };

                const img = new Image();
                img.onload = function() {
                    const temp = document.createElement('canvas');
                    temp.width = L.w; temp.height = L.h;
                    temp.getContext('2d').drawImage(img, 0, 0);

                    restoreUnder(function() {
                        if (activePastedData) commitActivePastedObject();
                        activePastedData = {
                            canvas: temp,
                            x: L.x, y: L.y, w: L.w, h: L.h,
                            rotation: rot,
                            isTransparent: L.isTransparent ?? true
                        };
                        createFloatingPastedDOM();
                        showToast("फिर से चुना — खींचें / Enter से लॉक (बैकग्राउंड नहीं बदलेगा)");
                    });
                };
                img.src = L.dataUrl;
                layers.splice(i, 1);
                saveCurrentPageInMemory();
                return true;
            }
            return false;
        }

function createFloatingPastedDOM() {
            if (activePastedElem) activePastedElem.remove();
            if (!activePastedData || !masterCanvas) return;

            const elem = document.createElement('div');
            elem.id = 'floatingPastedElement';
            // True Alpha: mix-blend-mode की आवश्यकता नहीं, पारदर्शी PNG की तरह रेंडर होता है
            elem.style.cssText = `position:absolute;z-index:9998;cursor:move;border:1px dashed rgba(99,102,241,0.75);outline:none;box-sizing:border-box;pointer-events:auto !important;transform-origin:center center;background:transparent;`;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = activePastedData.w;
            tempCanvas.height = activePastedData.h;
            tempCanvas.style.cssText = "width:100%; height:100%; display:block; pointer-events:none; background:transparent;";
            tempCanvas.getContext('2d').drawImage(activePastedData.canvas, 0, 0);
            elem.appendChild(tempCanvas);

            const rotHandle = document.createElement('div');
            rotHandle.className = 'paste-rotate-handle';
            rotHandle.innerHTML = '<i class="fa-solid fa-rotate-right"></i>';
            rotHandle.title = 'घुमाएँ / तिरछा करें';
            rotHandle.addEventListener('mousedown', (e) => {
                e.stopPropagation();
                e.preventDefault();
                startPasteRotation(e);
            });
            elem.appendChild(rotHandle);

            document.getElementById('fullScreenCanvasContainer').appendChild(elem);
            activePastedElem = elem;
            updateFloatingPastedDOMPosition();

            elem.addEventListener('dblclick', e => {
                e.stopPropagation();
                e.preventDefault();
                commitActivePastedObject();
                showToast("पेस्ट लॉक हो गया — Ctrl+क्लिक से फिर चुनकर मूव करें");
            });

            let isDrag = false, startMX = 0, startMY = 0, initX = 0, initY = 0;
            elem.addEventListener('mousedown', e => {
                if (e.button !== 0) return;
                if (e.target.closest('.paste-rotate-handle')) return;
                e.stopPropagation(); e.preventDefault();
                isDrag = true; startMX = e.clientX; startMY = e.clientY;
                initX = activePastedData.x; initY = activePastedData.y;
            });
            const onDragMove = e => {
                if (!isDrag || !masterCanvas || !activePastedData) return;
                const rect = masterCanvas.getBoundingClientRect();
                activePastedData.x = Math.max(0, Math.min(masterCanvas.width - activePastedData.w, initX + (e.clientX - startMX) * (masterCanvas.width / rect.width)));
                activePastedData.y = Math.max(0, Math.min(masterCanvas.height - activePastedData.h, initY + (e.clientY - startMY) * (masterCanvas.height / rect.height)));
                updateFloatingPastedDOMPosition();
            };
            const onDragEnd = () => { isDrag = false; };
            document.addEventListener('mousemove', onDragMove);
            document.addEventListener('mouseup', onDragEnd);
        }

        function updateFloatingPastedDOMPosition() {
            if (!activePastedElem || !activePastedData || !masterCanvas) return;
            const sx = masterCanvas.offsetWidth / masterCanvas.width;
            const sy = masterCanvas.offsetHeight / masterCanvas.height;
            activePastedElem.style.left = `${activePastedData.x * sx}px`;
            activePastedElem.style.top = `${activePastedData.y * sy}px`;
            activePastedElem.style.width = `${activePastedData.w * sx}px`;
            activePastedElem.style.height = `${activePastedData.h * sy}px`;
            const rot = activePastedData.rotation || 0;
            activePastedElem.style.transform = rot ? `rotate(${rot}deg)` : 'none';
            activePastedElem.style.pointerEvents = 'auto';
            activePastedElem.style.zIndex = '9998';
        }

        document.addEventListener('mousedown', e => {
            if (!masterCanvas || !e.target.closest('#fullScreenCanvasContainer')) return;
            if (e.target.closest('#floatingPastedElement')) return;
            if (e.target.closest('.seamless-text-item')) {
                const p = getCanvasNativeCoordinates(e.clientX, e.clientY);
                lastClickCanvasPos = p;
                return;
            }
            const p = getCanvasNativeCoordinates(e.clientX, e.clientY);
            lastClickCanvasPos = p;

            if ((e.ctrlKey || e.metaKey) && e.button === 0) {
                if (tryReselectLockedPasteAt(p.x, p.y)) {
                    e.preventDefault();
                    e.stopPropagation();
                    return;
                }
            }

            if (!moveMode) return;
            moveSelecting = true;
            moveStart = { point: p };
            clearMoveSelection();
        }, true);

        document.addEventListener('mousemove', e => {
            if (!moveMode || !moveSelecting || !masterCanvas) return;
            const p = getCanvasNativeCoordinates(e.clientX, e.clientY);
            moveRect = {
                x: Math.min(moveStart.point.x, p.x),
                y: Math.min(moveStart.point.y, p.y),
                w: Math.abs(p.x - moveStart.point.x),
                h: Math.abs(p.y - moveStart.point.y)
            };
            showMoveBox(moveRect);
        }, true);

        document.addEventListener('mouseup', () => {
            if (moveSelecting) {
                moveSelecting = false;
                if (!moveRect || moveRect.w < 2 || moveRect.h < 2) clearMoveSelection();
            }
        }, true);

        /* ROTATE & FLIP */
        function rotateCanvas(degrees) {
            if (!masterCanvas || !pagesData[currentPageIndex]) return showToast("पहले फाइल लोड करें");
            commitActivePastedObject();
            saveUndoState();

            const src = masterCanvas;
            const w = src.width, h = src.height;
            const rad = (degrees * Math.PI) / 180;
            const is90 = Math.abs(degrees) % 180 === 90;
            const newW = is90 ? h : w, newH = is90 ? w : h;

            const out = document.createElement('canvas');
            out.width = newW; out.height = newH;
            const octx = out.getContext('2d');
            octx.translate(newW / 2, newH / 2);
            octx.rotate(rad);
            octx.drawImage(src, -w / 2, -h / 2);

            const texts = captureTextEdits().map(t => {
                let nx = t.canvasX - w / 2, ny = t.canvasY - h / 2;
                return {
                    ...t,
                    canvasX: (nx * Math.cos(rad) - ny * Math.sin(rad)) + newW / 2,
                    canvasY: (nx * Math.sin(rad) + ny * Math.cos(rad)) + newH / 2
                };
            });

            pagesData[currentPageIndex].baseCanvas = out;
            pagesData[currentPageIndex].texts = texts;
            renderPageInEditor(currentPageIndex);
            showToast("कैनवास घुमाया गया");
        }

        function flipCanvas(axis) {
            if (!masterCanvas || !pagesData[currentPageIndex]) return showToast("पहले फाइल लोड करें");
            commitActivePastedObject();
            saveUndoState();

            const src = masterCanvas;
            const w = src.width, h = src.height;
            const out = document.createElement('canvas');
            out.width = w; out.height = h;
            const octx = out.getContext('2d');

            if (axis === 'h') { octx.translate(w, 0); octx.scale(-1, 1); }
            else { octx.translate(0, h); octx.scale(1, -1); }
            octx.drawImage(src, 0, 0);

            const texts = captureTextEdits().map(t => ({
                ...t,
                canvasX: axis === 'h' ? (w - t.canvasX - 10) : t.canvasX,
                canvasY: axis === 'v' ? (h - t.canvasY - 10) : t.canvasY
            }));

            pagesData[currentPageIndex].baseCanvas = out;
            pagesData[currentPageIndex].texts = texts;
            renderPageInEditor(currentPageIndex);
            showToast(axis === 'h' ? "Horizontal Flip" : "Vertical Flip");
        }

        /* EXPORT ENGINE */
        async function getFlattenedCanvasForPage(pageIdx) {
            if (pageIdx === currentPageIndex) {
                commitActivePastedObject();
                saveCurrentPageInMemory();
            }
            const pageObj = pagesData[pageIdx];
            if (!pageObj) return null;
            if (document.fonts) await document.fonts.ready;

            const outCanvas = document.createElement('canvas');
            outCanvas.width = pageObj.baseCanvas.width;
            outCanvas.height = pageObj.baseCanvas.height;
            const ctx = outCanvas.getContext('2d');
            ctx.drawImage(pageObj.baseCanvas, 0, 0);

            if (pageObj.texts) {
                pageObj.texts.forEach(item => {
                    const nativeFontSize = item.nativeFontSize || 28;
                    let fontName = "'Noto Sans Devanagari', sans-serif";
                    if (item.fontClass === 'font-devanagari-serif') fontName = "'Noto Serif Devanagari', serif";
                    else if (item.fontClass === 'font-handwriting') fontName = "'Kalam', cursive";
                    else if (item.fontClass === 'font-typewriter') fontName = "'Courier Prime', monospace";

                    ctx.save();
                    ctx.globalAlpha = parseFloat(item.opacity) || 1.0;
                    ctx.fillStyle = item.color || '#22252a';
                    const blurVal = parseFloat(item.blur || '0');
                    if (blurVal > 0 && ctx.filter) ctx.filter = `blur(${blurVal}px)`;
                    ctx.font = `${item.fontStyle === 'italic' ? 'italic ' : ''}${parseInt(item.fontWeight) >= 700 ? 'bold ' : ''}${nativeFontSize}px ${fontName}`;
                    ctx.textBaseline = 'top';

                    const rot = parseFloat(item.rotation) || 0;
                    const lines = item.text.split('\n');
                    const approxW = Math.max(...lines.map(l => {
                        try { return ctx.measureText(l).width; } catch(e) { return l.length * nativeFontSize * 0.6; }
                    }), nativeFontSize);
                    const approxH = lines.length * nativeFontSize * 1.15;
                    const pivX = item.canvasX + approxW / 2;
                    const pivY = item.canvasY + approxH / 2;
                    if (rot) {
                        ctx.translate(pivX, pivY);
                        ctx.rotate((rot * Math.PI) / 180);
                        ctx.translate(-pivX, -pivY);
                    }
                    lines.forEach((line, lIdx) => {
                        ctx.fillText(line, item.canvasX, item.canvasY + (nativeFontSize * 0.1) + (lIdx * nativeFontSize * 1.15));
                    });
                    ctx.restore();
                });
            }
            return outCanvas;
        }

        async function processExport() {
            if (!masterCanvas || pagesData.length === 0) return alert('डाउनलोड करने के लिए पहले कोई फाइल अपलोड करें!');
            commitActivePastedObject();
            saveCurrentPageInMemory();

            const format = document.getElementById('exportFormat').value;
            const isTargetSizeOn = document.getElementById('targetSizeToggle').checked;
            let targetBytes = 0;
            if (isTargetSizeOn) {
                targetBytes = parseFloat(document.getElementById('targetSizeValue').value) || 0;
                if (document.getElementById('targetSizeUnit').value === 'KB') targetBytes *= 1024;
                else targetBytes *= 1024 * 1024;
            }

            if (format === 'txt') {
                let fullText = "";
                pagesData.forEach((p, idx) => {
                    fullText += `--- Page ${idx + 1} ---\n`;
                    if (p.pdfTextItems) fullText += p.pdfTextItems.map(i => i.str).join(" ") + "\n";
                    if (p.ocrWords) fullText += p.ocrWords.map(w => w.text).join(" ") + "\n";
                    if (p.texts) fullText += p.texts.map(t => t.text).join("\n") + "\n\n";
                });
                triggerDownload(new Blob([fullText], { type: 'text/plain;charset=utf-8' }), `${loadedOriginalFileName}.txt`);
                return;
            }

            if (format === 'jpg' || format === 'png') {
                const canvas = await getFlattenedCanvasForPage(currentPageIndex);
                const dataUrl = canvas.toDataURL(format === 'jpg' ? 'image/jpeg' : 'image/png', 0.92);
                const res = await fetch(dataUrl);
                let blob = await res.blob();
                triggerDownload(isTargetSizeOn ? padBlobToTargetSize(blob, targetBytes) : blob, `${loadedOriginalFileName}_page${currentPageIndex + 1}.${format}`);
                showToast("इमेज सेव हो गई");
                return;
            }

            if (format === 'zip-jpg' || format === 'zip-png') {
                const zip = new JSZip();
                const ext = format === 'zip-jpg' ? 'jpg' : 'png';
                for (let i = 0; i < pagesData.length; i++) {
                    const canvas = await getFlattenedCanvasForPage(i);
                    const b64 = canvas.toDataURL(format === 'zip-jpg' ? 'image/jpeg' : 'image/png', 0.92).split(',')[1];
                    zip.file(`${loadedOriginalFileName}_${i + 1}.${ext}`, b64, { base64: true });
                }
                const zipBlob = await zip.generateAsync({ type: 'blob' });
                triggerDownload(zipBlob, `${loadedOriginalFileName}_pages.zip`);
                showToast("ZIP डाउनलोड हो गया");
                return;
            }

            if (format === 'pdf') {
                const { jsPDF } = window.jspdf;
                let pdf = null;
                for (let i = 0; i < pagesData.length; i++) {
                    const canvas = await getFlattenedCanvasForPage(i);
                    if (i === 0) pdf = new jsPDF('p', 'pt', [canvas.width, canvas.height]);
                    else pdf.addPage([canvas.width, canvas.height], canvas.width > canvas.height ? 'l' : 'p');
                    pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, canvas.width, canvas.height);
                }
                triggerDownload(pdf.output('blob'), `${loadedOriginalFileName}_edited.pdf`);
                showToast("PDF डाउनलोड हो गया");
            }
        }

        function triggerDownload(blob, filename) {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function padBlobToTargetSize(originalBlob, targetBytes) {
            if (originalBlob.size >= targetBytes) return originalBlob;
            return new Blob([originalBlob, new Uint8Array(targetBytes - originalBlob.size)], { type: originalBlob.type });
        }

        /* PRINT */
        async function triggerCleanPrint() {
            if (!masterCanvas || !pagesData.length) return alert('प्रिंट करने के लिए पहले कोई फाइल खोलें');
            commitActivePastedObject();
            saveCurrentPageInMemory();

            const iframe = document.createElement('iframe');
            iframe.style.position = 'fixed'; iframe.style.left = '-9999px';
            document.body.appendChild(iframe);

            let html = `<!doctype html><html><head><style>@page{size:auto;margin:0;}body{margin:0;}img{width:100vw;height:100vh;object-fit:contain;page-break-after:always;}</style></head><body>`;
            for (let i = 0; i < pagesData.length; i++) {
                const canvas = await getFlattenedCanvasForPage(i);
                html += `<img src="${canvas.toDataURL('image/png')}">`;
            }
            html += `</body></html>`;

            const doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open(); doc.write(html); doc.close();
            setTimeout(() => {
                iframe.contentWindow.focus();
                iframe.contentWindow.print();
                setTimeout(() => iframe.remove(), 1000);
            }, 600);
        }

        /* STRAIGHTEN / PERSPECTIVE TOOL */
        function startStraightenTool() {
            if (!masterCanvas) return alert('पहले कोई फाइल खोलें');
            commitActivePastedObject();
            cancelStraightenTool();

            const c = document.getElementById('fullScreenCanvasContainer');
            const overlay = document.createElement('div');
            overlay.className = 'straighten-overlay';
            c.appendChild(overlay);

            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('class', 'straighten-svg-layer');
            const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
            poly.setAttribute('fill', 'rgba(14, 165, 233, 0.15)');
            poly.setAttribute('stroke', '#0284c7');
            poly.setAttribute('stroke-width', '2');
            poly.setAttribute('stroke-dasharray', '4 4');
            svg.appendChild(poly); overlay.appendChild(svg);

            const W = c.offsetWidth, H = c.offsetHeight;
            const pts = [{ x: 20, y: 20 }, { x: W - 20, y: 20 }, { x: W - 20, y: H - 20 }, { x: 20, y: H - 20 }];
            const updateLines = () => poly.setAttribute('points', pts.map(p => `${p.x},${p.y}`).join(' '));

            pts.forEach(p => {
                const h = document.createElement('div');
                h.className = 'straighten-point';
                h.style.left = `${p.x}px`; h.style.top = `${p.y}px`;
                h.addEventListener('mousedown', ev => {
                    ev.preventDefault(); ev.stopPropagation();
                    const move = me => {
                        const pos = getCanvasNativeCoordinates(me.clientX, me.clientY);
                        p.x = pos.x * (W / masterCanvas.width);
                        p.y = pos.y * (W / masterCanvas.width);
                        h.style.left = `${p.x}px`; h.style.top = `${p.y}px`;
                        updateLines();
                    };
                    const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
                    document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
                });
                overlay.appendChild(h);
            });

            updateLines();
            straightenState = { overlay, points: pts };
            document.getElementById('straightenControls').classList.remove('hidden');
            document.getElementById('straightenBtn').classList.add('hidden');
        }

        function cancelStraightenTool() {
            if (straightenState?.overlay) straightenState.overlay.remove();
            straightenState = null;
            document.getElementById('straightenControls')?.classList.add('hidden');
            document.getElementById('straightenBtn')?.classList.remove('hidden');
        }

        function applyStraightenTool() {
            if (!straightenState || !masterCanvas) return;
            const pts = straightenState.points;
            const c = document.getElementById('fullScreenCanvasContainer');
            const sx = masterCanvas.width / c.offsetWidth, sy = masterCanvas.height / c.offsetHeight;

            const W = Math.max(10, Math.round(Math.max(Math.hypot((pts[1].x - pts[0].x) * sx, (pts[1].y - pts[0].y) * sy), Math.hypot((pts[2].x - pts[3].x) * sx, (pts[2].y - pts[3].y) * sy))));
            const H = Math.max(10, Math.round(Math.max(Math.hypot((pts[3].x - pts[0].x) * sx, (pts[3].y - pts[0].y) * sy), Math.hypot((pts[2].x - pts[1].x) * sx, (pts[2].y - pts[1].y) * sy))));

            const src = masterCtx.getImageData(0, 0, masterCanvas.width, masterCanvas.height);
            const out = document.createElement('canvas');
            out.width = W; out.height = H;
            const od = out.getContext('2d').createImageData(W, H);
            const d = src.data;

            for (let y = 0; y < H; y++) {
                const v = y / (H - 1 || 1);
                for (let x = 0; x < W; x++) {
                    const u = x / (W - 1 || 1);
                    const tx = pts[0].x + (pts[1].x - pts[0].x) * u;
                    const ty = pts[0].y + (pts[1].y - pts[0].y) * u;
                    const bx = pts[3].x + (pts[2].x - pts[3].x) * u;
                    const by = pts[3].y + (pts[2].y - pts[3].y) * u;
                    const ix = Math.max(0, Math.min(masterCanvas.width - 1, Math.round((tx + (bx - tx) * v) * sx)));
                    const iy = Math.max(0, Math.min(masterCanvas.height - 1, Math.round((ty + (by - ty) * v) * sy)));
                    const si = (iy * masterCanvas.width + ix) * 4;
                    const di = (y * W + x) * 4;
                    od.data[di] = d[si]; od.data[di + 1] = d[si + 1]; od.data[di + 2] = d[si + 2]; od.data[di + 3] = d[si + 3];
                }
            }

            out.getContext('2d').putImageData(od, 0, 0);
            saveUndoState();
            pagesData[currentPageIndex].baseCanvas = out;
            cancelStraightenTool();
            renderPageInEditor(currentPageIndex);
            showToast("कैनवास सीधा हो गया");
        }

        window.addEventListener('DOMContentLoaded', () => {
            selectPsTool('text');
        });
    </script>
