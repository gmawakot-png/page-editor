<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G Bisht Pro - Photoshop Edition</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Noto+Serif+Devanagari:wght@400;700&family=Kalam:wght@400;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Engine Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', sans-serif; }
        .font-devanagari { font-family: 'Noto Sans Devanagari', sans-serif !important; }
        .font-devanagari-serif { font-family: 'Noto Serif Devanagari', serif !important; }
        .font-handwriting { font-family: 'Kalam', cursive !important; }
        .font-typewriter { font-family: 'Courier Prime', monospace !important; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }

        /* WORKSPACE AREA */
        #mainWorkspaceArea {
            flex: 1;
            overflow: auto;
            background: #181a1f;
            position: relative;
            display: block;
        }

        #zoomOuterWrapper {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            padding: 80px !important;
            min-width: 100%;
            min-height: 100%;
            width: max-content;
            height: max-content;
            box-sizing: border-box !important;
            margin: auto !important;
        }

        #fullScreenCanvasContainer {
            position: relative;
            display: block;
            transform-origin: center center !important;
            transition: transform 0.08s ease-out;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            border: 1px solid #2d3748;
            background: #ffffff;
            user-select: none;
            margin: auto !important;
        }

        /* TEXT LAYERS */
        .pdf-text-layer {
            position: absolute; inset: 0; z-index: 45; pointer-events: none;
            user-select: none !important; -webkit-user-select: text !important; overflow: hidden;
        }
        .pdf-text-layer span {
            position: absolute; color: transparent; cursor: text; white-space: pre;
            transform-origin: 0% 0%; pointer-events: none !important; line-height: 1.0;
        }
        .pdf-text-layer span::selection {
            background: rgba(99, 102, 241, 0.28) !important; color: transparent !important;
        }

        .ocr-text-layer {
            position: absolute; inset: 0; z-index: 46; pointer-events: auto;
            user-select: none !important; overflow: hidden;
        }
        .ocr-text-layer span {
            position: absolute; color: transparent; cursor: text; white-space: pre;
            pointer-events: none !important; line-height: 1; font-family: 'Noto Sans Devanagari', sans-serif;
        }

        /* SEAMLESS TEXT ITEM */
        .seamless-text-item {
            position: absolute; z-index: 50; background: transparent !important;
            padding: 0px !important; margin: 0px !important; outline: none !important;
            border: none !important; cursor: move; white-space: pre; word-break: normal;
            line-height: 1.15 !important; user-select: none; box-sizing: border-box;
            display: inline-block; pointer-events: auto; min-width: 5px; min-height: 15px;
            transform-origin: center center;
        }
        .seamless-text-item.selected { outline: 1px dashed #6366f1 !important; }
        .seamless-text-item.editing { 
            cursor: text !important; user-select: text !important; 
            outline: none !important; background: transparent !important; 
            z-index: 100 !important;
        }
        /* Rotation handle */
        .text-rotate-handle, .paste-rotate-handle {
            position: absolute;
            width: 18px; height: 18px;
            background: #6366f1;
            border: 2px solid #fff;
            border-radius: 50%;
            cursor: grab;
            z-index: 10001;
            display: none;
            align-items: center; justify-content: center;
            color: #fff; font-size: 9px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.45);
            pointer-events: auto !important;
            user-select: none;
            -webkit-user-select: none;
        }
        .text-rotate-handle.visible, .paste-rotate-handle { display: flex; }
        .text-rotate-handle:hover, .paste-rotate-handle:hover { background: #4f46e5; }
        .text-rotate-handle:active, .paste-rotate-handle:active { cursor: grabbing; }

        /* PHOTOSHOP CLASSIC DOCKED TOOLBAR */
        .ps-toolbox {
            width: 48px;
            background: #2b2d30;
            border-right: 1px solid #1a1b1d;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px 0;
            user-select: none;
            z-index: 50;
            shrink: 0;
        }
        .ps-tool-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            color: #9da5b4;
            font-size: 15px;
            margin-bottom: 2px;
            transition: all 0.15s ease;
            position: relative;
        }
        .ps-tool-btn:hover {
            background: #3a3d42;
            color: #ffffff;
        }
        .ps-tool-btn.active {
            background: #111214;
            color: #38bdf8;
            border-left: 2px solid #38bdf8;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }

        /* PHOTOSHOP COLOR SWATCH */
        .ps-swatch-box {
            position: relative;
            width: 34px;
            height: 34px;
            margin-top: 10px;
        }
        .ps-swatch-fg {
            position: absolute;
            top: 0; left: 0;
            width: 20px; height: 20px;
            border: 1.5px solid #fff;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            z-index: 2;
            cursor: pointer;
        }
        .ps-swatch-bg {
            position: absolute;
            bottom: 0; right: 0;
            width: 20px; height: 20px;
            border: 1.5px solid #fff;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            z-index: 1;
            cursor: pointer;
        }
        .ps-swatch-swap {
            position: absolute;
            top: -6px; right: -4px;
            color: #9da5b4;
            font-size: 9px;
            cursor: pointer;
        }
        .ps-swatch-swap:hover { color: #fff; }

        /* PREVIEWS & MARQUEE */
        .selection-marquee {
            position: absolute; border: 1px dashed #6366f1; background: rgba(99, 102, 241, 0.15); pointer-events: none; z-index: 1000;
        }
        .eraser-active { cursor: crosshair !important; }
        .panning-active { cursor: grabbing !important; }
        .editor-eraser-preview { 
            position: absolute; z-index: 99999 !important; pointer-events: none !important; 
            box-sizing: border-box; background: rgba(236, 72, 153, 0.25); border: 2px dashed #db2777; 
        }

        #floatingPastedElement {
            position: absolute; z-index: 9998; cursor: move; border: 1px dashed rgba(99,102,241,0.7); outline: none; box-sizing: border-box;
            pointer-events: auto !important; transform-origin: center center;
        }
        #moveSelectionBox {
            user-select:none; background: transparent !important;
            border: 1px dashed rgba(37, 99, 235, 0.85) !important;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.8);
        }

        /* Straighten */
        .straighten-overlay { position: absolute; inset: 0; z-index: 90000; pointer-events: none; background: rgba(15, 23, 42, 0.45); }
        .straighten-svg-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
        .straighten-point {
            position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.4); border: 2px solid #0284c7; box-shadow: 0 0 0 3px rgba(255,255,255,0.9);
            pointer-events: auto; cursor: move; z-index: 90002;
        }

        #toastNotification {
            position: fixed; bottom: 20px; right: 20px; background: #1e293b; color: #fff;
            padding: 8px 16px; border-radius: 6px; font-size: 12px; font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); border: 1px solid #334155; z-index: 999999;
            display: none; align-items: center; gap: 8px;
        }
    </style>
</head>
<body class="bg-[#181a1f] text-slate-200 h-screen flex flex-col overflow-hidden select-none">

    <!-- TOAST NOTIFICATION -->
    <div id="toastNotification">
        <i class="fa-solid fa-circle-info text-sky-400"></i>
        <span id="toastText">संदेश</span>
    </div>

    <!-- 1. TOP MAIN APPLICATION HEADER -->
    <header class="bg-[#212327] border-b border-[#181a1f] h-[46px] px-3 flex items-center justify-between z-40 shrink-0 text-xs">
        
        <!-- BRAND & OPEN FILE -->
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2 font-bold text-slate-100 text-sm">
                <span class="w-6 h-6 bg-sky-600 rounded flex items-center justify-center text-xs font-black text-white shadow">Ps</span>
                <span>G Bisht Editor</span>
            </div>
            
            <div class="h-4 w-[1px] bg-slate-700 mx-1"></div>

            <!-- MULTI-FILE OPEN -->
            <button onclick="document.getElementById('universalFileInput').click()" class="bg-[#2d3139] hover:bg-[#383d47] text-slate-200 px-2.5 py-1 rounded font-semibold flex items-center gap-1.5 transition">
                <i class="fa-solid fa-folder-open text-sky-400"></i> फ़ाइल खोलें (PDF/Img)
            </button>
            <input type="file" id="universalFileInput" accept="application/pdf,image/*" multiple class="hidden" onchange="handleUniversalUpload(event); this.value=''">

            <!-- MULTI-PAGE NAVIGATOR -->
            <div id="multiPageControls" class="hidden flex items-center bg-[#181a1f] px-2 py-0.5 rounded border border-slate-700">
                <button onclick="changePdfPage(-1)" class="hover:text-sky-400 px-1.5"><i class="fa-solid fa-chevron-left text-[10px]"></i></button>
                <span id="pageIndicatorText" class="text-[11px] text-slate-300 font-bold px-2">1 / 1</span>
                <button onclick="changePdfPage(1)" class="hover:text-sky-400 px-1.5"><i class="fa-solid fa-chevron-right text-[10px]"></i></button>
            </div>
            
            <span id="loadedFileNameDisplay" class="text-[11px] text-slate-400 truncate max-w-[150px] hidden font-mono"></span>
        </div>

        <!-- ROTATE, STRAIGHTEN, HISTORY & ZOOM -->
        <div class="flex items-center gap-1.5">
            <button onmousedown="event.preventDefault()" onclick="startStraightenTool()" id="straightenBtn" class="bg-[#2d3139] hover:bg-[#383d47] text-slate-200 px-2 py-1 rounded font-semibold text-[11px] transition" title="सीधा करें (Crop / Straighten)">
                <i class="fa-solid fa-crop-simple text-sky-400"></i> सीधा करें
            </button>
            <div id="straightenControls" class="hidden flex gap-1">
                <button onmousedown="event.preventDefault()" onclick="applyStraightenTool()" class="bg-emerald-600 px-2 py-0.5 rounded font-bold text-white text-[11px]">✓</button>
                <button onmousedown="event.preventDefault()" onclick="cancelStraightenTool()" class="bg-slate-700 px-2 py-0.5 rounded font-bold text-white text-[11px]">✕</button>
            </div>

            <!-- Rotate & Flip -->
            <div class="flex items-center bg-[#2d3139] rounded p-0.5 border border-slate-700">
                <button onmousedown="event.preventDefault()" onclick="rotateCanvas(-90)" class="hover:bg-slate-700 px-2 py-0.5 rounded text-[11px]" title="90° Left"><i class="fa-solid fa-rotate-left"></i></button>
                <button onmousedown="event.preventDefault()" onclick="rotateCanvas(90)" class="hover:bg-slate-700 px-2 py-0.5 rounded text-[11px]" title="90° Right"><i class="fa-solid fa-rotate-right"></i></button>
                <button onmousedown="event.preventDefault()" onclick="flipCanvas('h')" class="hover:bg-slate-700 px-1.5 py-0.5 rounded text-[10px]" title="Flip H">H-Flip</button>
                <button onmousedown="event.preventDefault()" onclick="flipCanvas('v')" class="hover:bg-slate-700 px-1.5 py-0.5 rounded text-[10px]" title="Flip V">V-Flip</button>
            </div>

            <!-- Undo / Redo -->
            <div class="flex items-center bg-[#2d3139] rounded p-0.5 border border-slate-700">
                <button onclick="performUndo()" class="hover:bg-slate-700 px-2 py-0.5 rounded text-[11px]" title="Undo (Ctrl+Z)"><i class="fa-solid fa-arrow-rotate-left"></i></button>
                <button onclick="performRedo()" class="hover:bg-slate-700 px-2 py-0.5 rounded text-[11px]" title="Redo (Ctrl+Y)"><i class="fa-solid fa-arrow-rotate-right"></i></button>
            </div>

            <button onmousedown="event.preventDefault()" onclick="reloadOriginalCanvasState()" class="hover:text-rose-400 px-1 text-[11px]" title="Reset Canvas">
                <i class="fa-solid fa-clock-rotate-left"></i>
            </button>
        </div>

        <!-- EXPORT & PRINT -->
        <div class="flex items-center gap-2">
            <!-- TARGET SIZE LIMIT -->
            <div class="flex items-center gap-1.5 bg-[#181a1f] px-2 py-0.5 rounded border border-slate-700 text-[11px]">
                <label class="flex items-center gap-1 cursor-pointer font-semibold text-slate-300">
                    <input type="checkbox" id="targetSizeToggle" onchange="toggleTargetSizeState()" class="accent-sky-500 cursor-pointer w-3 h-3">
                    <span>Size</span>
                </label>
                <div id="targetInputs" class="flex items-center gap-1 opacity-30 pointer-events-none transition-all">
                    <input type="number" id="targetSizeValue" value="5" class="w-10 bg-slate-800 border border-slate-600 rounded px-1 py-0.2 text-center text-white">
                    <select id="targetSizeUnit" class="bg-slate-800 border border-slate-600 rounded text-white text-[10px]">
                        <option value="KB">KB</option>
                        <option value="MB" selected>MB</option>
                    </select>
                </div>
            </div>

            <!-- EXPORT DROPDOWN + DOWNLOAD -->
            <div class="flex items-center bg-[#2d3139] rounded border border-slate-700 p-0.5">
                <select id="exportFormat" class="bg-transparent text-white text-xs font-semibold px-1 py-0.5 outline-none cursor-pointer">
                    <option class="bg-[#212327]" value="jpg">JPG (Page)</option>
                    <option class="bg-[#212327]" value="png">PNG (Page)</option>
                    <option class="bg-[#212327]" value="pdf">PDF (All)</option>
                    <option class="bg-[#212327]" value="zip-jpg">ZIP JPG</option>
                    <option class="bg-[#212327]" value="zip-png">ZIP PNG</option>
                    <option class="bg-[#212327]" value="txt">Text (.txt)</option>
                </select>
                <button onclick="processExport()" class="bg-sky-600 hover:bg-sky-500 text-white font-bold px-2.5 py-0.5 rounded text-xs transition flex items-center gap-1">
                    <i class="fa-solid fa-download"></i> Save
                </button>
            </div>

            <!-- PRINT -->
            <button onclick="triggerCleanPrint()" class="bg-[#2d3139] hover:bg-slate-700 text-slate-200 px-2.5 py-1 rounded text-xs" title="Print Document">
                <i class="fa-solid fa-print"></i>
            </button>
        </div>
    </header>

    <!-- 2. PHOTOSHOP DYNAMIC CONTEXTUAL OPTIONS BAR -->
    <div id="psOptionsBar" class="bg-[#282a2e] border-b border-[#181a1f] h-[34px] px-3 flex items-center justify-between text-xs text-slate-300 shrink-0">
        <div id="activeToolSettingsGroup" class="flex items-center gap-3"></div>

        <!-- QUICK CANVAS ZOOM LEVEL -->
        <div class="flex items-center gap-1 text-[11px] text-slate-400">
            <button onclick="adjustZoom(-0.1)" class="w-5 h-5 flex items-center justify-center hover:bg-slate-700 rounded text-white">-</button>
            <span id="zoomVal" class="text-sky-400 font-bold min-w-[38px] text-center">100%</span>
            <button onclick="adjustZoom(0.1)" class="w-5 h-5 flex items-center justify-center hover:bg-slate-700 rounded text-white">+</button>
            <button onclick="resetZoom()" class="ml-1 px-1.5 py-0.5 bg-[#181a1f] hover:bg-slate-700 text-slate-300 rounded border border-slate-700 text-[10px]">100%</button>
        </div>
    </div>

    <!-- 3. MAIN WORKSPACE CONTAINER -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- PHOTOSHOP DOCKED TOOLBAR -->
        <aside class="ps-toolbox shrink-0">
            <button id="toolMove" onclick="selectPsTool('move')" class="ps-tool-btn" title="Select Tool (V) – आयत से चुनें, Cut/Copy/Paste">
                <i class="fa-regular fa-square"></i>
            </button>

            <button id="toolText" onclick="selectPsTool('text')" class="ps-tool-btn active" title="Type / Text Tool (T)">
                <i class="fa-solid fa-i-cursor"></i>
            </button>

            <button id="toolStamp" onclick="selectPsTool('stamp')" class="ps-tool-btn" title="Clone Stamp Tool (S) - Alt+Click to pick source">
                <i class="fa-solid fa-stamp"></i>
            </button>

            <button id="toolEraser" onclick="selectPsTool('eraser')" class="ps-tool-btn" title="Eraser Tool (E)">
                <i class="fa-solid fa-eraser"></i>
            </button>

            <button id="toolEyedropper" onclick="pickColorFromDocument()" class="ps-tool-btn" title="Eyedropper Tool (I)">
                <i class="fa-solid fa-eye-dropper"></i>
            </button>

            <button id="toolHand" onclick="selectPsTool('hand')" class="ps-tool-btn" title="Hand / Pan Tool (H)">
                <i class="fa-solid fa-hand"></i>
            </button>

            <button id="toolZoom" onclick="resetZoom()" class="ps-tool-btn" title="Zoom Fit (Z)">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>

            <div class="w-6 h-[1px] bg-slate-700 my-2"></div>

            <!-- DUAL COLOR CHIPS -->
            <div class="ps-swatch-box" title="Foreground (Text Ink) / Background (Eraser Tint)">
                <i onclick="swapForegroundBackgroundColor()" class="fa-solid fa-repeat ps-swatch-swap" title="Swap Colors (X)"></i>
                <input type="color" id="liveInkColor" value="#22252a" oninput="applyForegroundInkColor(this.value)" onchange="applyForegroundInkColor(this.value)" class="ps-swatch-fg p-0 bg-transparent cursor-pointer" title="Foreground: स्याही का रंग">
                <input type="color" id="eraserColor" value="#ffffff" class="ps-swatch-bg p-0 bg-transparent cursor-pointer" title="Background: मिटाने का रंग">
            </div>
        </aside>

        <!-- CANVAS WORKSPACE -->
        <section id="mainWorkspaceArea" class="flex-1 relative overflow-auto">
            <div id="zoomOuterWrapper">
                <div id="fullScreenCanvasContainer" style="transform: scale(1.0);" class="relative bg-white shadow-2xl rounded">
                    <div id="canvasPlaceholder" class="p-16 text-center text-slate-500">
                        <i class="fa-solid fa-file-circle-plus text-5xl mb-3 text-slate-600 block"></i>
                        <p class="font-bold text-sm text-slate-300">कोई फाइल लोड नहीं है</p>
                        <p class="text-xs text-slate-500 mt-1">ऊपर 'फ़ाइल खोलें' बटन से PDF या फोटो चुनें</p>
                    </div>
                </div>
            </div>
        </section>

    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pagesData = []; 
        let currentPageIndex = 0;
        let currentZoom = 1.0;

        let activePsTool = 'text';
        let isEraserMode = false;
        let isErasing = false;
        
        let masterCanvas = null;
        let masterCtx = null;
        
        let eraserBrushSize = 25;
        let eraserOpacity = 100;
        let eraserShape = 'rect';
        let eraserStart = null;
        let eraserPreview = null;
        let magicEraserMode = false;
        let magicEraserTolerance = 40;
        let straightenState = null;

        // Stamp tool
        let isStampMode = false;
        let stampSourcePoint = null;
        let stampOffsetX = 0, stampOffsetY = 0;
        let isStampPainting = false;
        let stampBrushSize = 40;
        let stampSoftness = 35;
        let stampCursorPreview = null;

        let selectedTextElems = [];
        let selectedTextElem = null;
        let undoStack = [];
        let redoStack = [];

        let loadedOriginalFileName = "document";

        // Drag Selection Engine
        let isBoxSelecting = false;
        let boxSelectStart = { x: 0, y: 0, clientX: 0, clientY: 0 };
        let marqueeElem = null;

        // Panning Engine
        let isSpacePressed = false;
        let isPanning = false;
        let startPanX = 0, startPanY = 0;
        let initialScrollLeft = 0, initialScrollTop = 0;

        let lastClickCanvasPos = { x: 50, y: 50 };

        function showToast(msg) {
            const toast = document.getElementById('toastNotification');
            document.getElementById('toastText').innerText = msg;
            toast.style.display = 'flex';
            setTimeout(() => { toast.style.display = 'none'; }, 2600);
        }

        /* ========================================================
           PHOTOSHOP TOOL SWITCHER & DYNAMIC TOP BAR BUILDER
           ======================================================== */
        function selectPsTool(toolName) {
            activePsTool = toolName;
            document.querySelectorAll('.ps-tool-btn').forEach(btn => btn.classList.remove('active'));

            const toolBtnMap = {
                'move': 'toolMove',
                'text': 'toolText',
                'stamp': 'toolStamp',
                'eraser': 'toolEraser',
                'hand': 'toolHand'
            };
            if (toolBtnMap[toolName]) {
                const btn = document.getElementById(toolBtnMap[toolName]);
                if (btn) btn.classList.add('active');
            }

            if (toolName !== 'move' && moveMode) setMoveMode(false);
            if (toolName !== 'eraser' && isEraserMode) toggleEraserTool(false);
            if (toolName !== 'stamp' && isStampMode) toggleStampTool(false);

            renderTopOptionsBar(toolName);

            if (toolName === 'move') {
                setMoveMode(true);
            } else if (toolName === 'eraser') {
                toggleEraserTool(true);
            } else if (toolName === 'stamp') {
                toggleStampTool(true);
            } else if (toolName === 'text') {
                showToast("Text Tool एक्टिव - डबल-क्लिक करके लिखें या बदलें");
            } else if (toolName === 'hand') {
                showToast("Hand Tool - माउस दबाकर कैनवास खिसकाएँ");
            }

            if (activePastedElem) {
                activePastedElem.style.pointerEvents = 'auto';
                activePastedElem.style.zIndex = '9998';
            }
        }

        function renderTopOptionsBar(tool) {
            const group = document.getElementById('activeToolSettingsGroup');
            if (!group) return;

            if (tool === 'text') {
                group.innerHTML = `

        // PREVENT OUTSIDE PASTE COLLISION
        document.addEventListener('paste', (e) => {
            const active = document.activeElement;
            const isEditingText = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.classList.contains('editing'));
            if (!isEditingText) {
                e.preventDefault();
                e.stopPropagation();
                if (moveClipboard) {
                    pasteMoveSelectionAt(lastClickCanvasPos.x, lastClickCanvasPos.y);

            }
        }, true);

        // DESELECT TEXT WHEN CLICKING BLANK CANVAS
        document.addEventListener('mousedown', (e) => {
            if (e.target.closest('.seamless-text-item') ||
                e.target.closest('aside') ||
                e.target.closest('header') ||
                e.target.closest('#psOptionsBar')) {
                return;

            const composing = document.querySelector('.seamless-text-item[data-composing="1"]');

        // GLOBAL KEYBOARD SHORTCUTS
        window.addEventListener('keydown', (e) => {
            const workspace = document.getElementById('mainWorkspaceArea');
            const active = document.activeElement;
            const isTyping = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.classList.contains('editing'));

            if (e.ctrlKey || e.metaKey) {
                const key = e.key.toLowerCase();
                if (key === 'z') { e.preventDefault(); if (e.shiftKey) performRedo(); else performUndo(); return; }
                if (key === 'y') { e.preventDefault(); performRedo(); return; }
                if (key === 'x' && !isTyping) {
                    e.preventDefault();
                    if (moveRect && moveRect.w >= 2) {
                        cutMoveSelection();
                    } else if (selectedTextElems.length > 0) {
                        saveUndoState();
                        const texts = selectedTextElems.map(el => el.innerText).join('\n');
                        try { navigator.clipboard.writeText(texts); } catch(err) {}
                        selectedTextElems.forEach(el => el.remove());
                        selectedTextElems = [];
                        selectedTextElem = null;
                        if (pagesData[currentPageIndex]) pagesData[currentPageIndex].texts = captureTextEdits();
                        showToast("टेक्स्ट कट हो गया");
                    } else {
                        showToast("पहले Select टूल से एरिया चुनें");
                    }
                    return;
                }
                if (key === 'c' && !isTyping) {
                    e.preventDefault();
                    if (moveRect && moveRect.w >= 2) {
                        copyMoveSelection();
                    } else if (selectedTextElems.length > 0) {
                        const texts = selectedTextElems.map(el => el.innerText).join('\n');
                        try { navigator.clipboard.writeText(texts); } catch(err) {}
                        showToast("टेक्स्ट कॉपी हो गया");
                    } else {
                        showToast("पहले Select टूल से एरिया चुनें");
                    }
                    return;
                }
                if (key === 'v' && !isTyping) {
                    e.preventDefault();
                    if (moveClipboard) {
                        pasteMoveSelectionAt(lastClickCanvasPos.x, lastClickCanvasPos.y);
                    }
                    return;
                }
                if (key === 'b' && !moveMode && !isTyping) { e.preventDefault(); toggleSelectedBold(); return; }
                if (key === 'i' && !moveMode && !isTyping) { e.preventDefault(); toggleSelectedItalic(); return; }
                if (key === 'u' && !moveMode && !isTyping) { e.preventDefault(); toggleSelectedUnderline(); return; }
            }

            if (isTyping) return;

            const k = e.key.toLowerCase();
            if (k === 'v') { selectPsTool('move'); return; }
            if (k === 'm') { selectPsTool('move'); return; }
            if (k === 't') { selectPsTool('text'); return; }
            if (k === 's') { selectPsTool('stamp'); return; }
            if (k === 'e') { selectPsTool('eraser'); return; }
            if (k === 'h') { selectPsTool('hand'); return; }
            if (k === 'x') { swapForegroundBackgroundColor(); return; }
            if (k === 'z') { resetZoom(); return; }

            const isArrow = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key);

            if (activePastedData && isArrow) {
                e.preventDefault();
                const step = e.shiftKey ? 5 : 1;
                if (e.key === 'ArrowLeft')  activePastedData.x -= step;
                if (e.key === 'ArrowRight') activePastedData.x += step;
                if (e.key === 'ArrowUp')    activePastedData.y -= step;
                if (e.key === 'ArrowDown')  activePastedData.y += step;
                updateFloatingPastedDOMPosition();
                return;
            }

            if (activePastedData && (e.key === 'Enter' || e.key === 'Escape')) {
                e.preventDefault();
                commitActivePastedObject();
                showToast("पेस्ट लॉक हो गया — Ctrl+क्लिक से फिर चुनकर मूव करें");
                return;
            }

            if (selectedTextElems.length > 0 && isArrow) {
                e.preventDefault();
                const nudgeStep = e.shiftKey ? 5 : 1;

                selectedTextElems.forEach(elem => {
                    let curX = parseFloat(elem.dataset.canvasX) || 0;
                    let curY = parseFloat(elem.dataset.canvasY) || 0;
                    if (e.key === 'ArrowLeft') curX -= nudgeStep;
                    if (e.key === 'ArrowRight') curX += nudgeStep;
                    if (e.key === 'ArrowUp') curY -= nudgeStep;
                    if (e.key === 'ArrowDown') curY += nudgeStep;
                    updateTextElemPosition(elem, curX, curY);
                });

                if (pagesData[currentPageIndex]) {
                    pagesData[currentPageIndex].texts = captureTextEdits();
                }
                return;
            }

            if (e.code === 'Space') {
                isSpacePressed = true;
                if (workspace) workspace.classList.add('panning-active');
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                isSpacePressed = false;
                const workspace = document.getElementById('mainWorkspaceArea');
                if (workspace && activePsTool !== 'hand') workspace.classList.remove('panning-active');

            if (!isPanning) return;
            const dx = e.clientX - startPanX;
            const dy = e.clientY - startPanY;
            workspaceArea.scrollLeft = initialScrollLeft - dx;
            workspaceArea.scrollTop = initialScrollTop - dy;
        });

        function getCanvasNativeCoordinates(clientX, clientY) {
            if (!masterCanvas) return { x: 0, y: 0 };
            const rect = masterCanvas.getBoundingClientRect();
            const scaleX = masterCanvas.width / rect.width;
            const scaleY = masterCanvas.height / rect.height;
            return {
                x: Math.max(0, Math.min(masterCanvas.width, (clientX - rect.left) * scaleX)),
                y: Math.max(0, Math.min(masterCanvas.height, (clientY - rect.top) * scaleY))
            };
        }

        // OCR FOR IMAGE
        async function runImageOCR(canvas) {
            if (typeof Tesseract === 'undefined') return [];
            try {
                const result = await Tesseract.recognize(canvas, 'hin+eng');
                return (result.data?.words || []).filter(w => w?.text?.trim() && w.bbox).map(w => ({
                    text: w.text, x: Number(w.bbox.x0) || 0, y: Number(w.bbox.y0) || 0,
                    width: Math.max(2, (Number(w.bbox.x1) || 0) - (Number(w.bbox.x0) || 0)),
                    height: Math.max(8, (Number(w.bbox.y1) || 0) - (Number(w.bbox.y0) || 0))
                }));
            } catch (err) {
                return [];
            }
        }

        /* MULTIPLE FILE UPLOADER ENGINE */
        async function handleUniversalUpload(event) {
            const files = Array.from(event.target.files || []);
            if (!files.length) return;

            setMoveMode(false);

            loadedOriginalFileName = files[0].name.substring(0, files[0].name.lastIndexOf('.')) || files[0].name;
            const label = document.getElementById('loadedFileNameDisplay');
            label.innerText = files.length === 1 ? files[0].name : `${files.length} Files`;
            label.classList.remove('hidden');

            pagesData = [];
            currentPageIndex = 0;
            undoStack = [];
            redoStack = [];

            showToast("फ़ाइल प्रोसेस हो रही है...");

            for (let file of files) {
                try {
                    if (file.type === 'application/pdf') {
                        const arrayBuffer = await file.arrayBuffer();
                        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                        
                        for (let pNum = 1; pNum <= pdf.numPages; pNum++) {
                            const page = await pdf.getPage(pNum);
                            const viewport = page.getViewport({ scale: 2 });

                            const canvas = document.createElement('canvas');
                            canvas.height = viewport.height;
                            canvas.width = viewport.width;
                            const context = canvas.getContext('2d');
                            await page.render({ canvasContext: context, viewport: viewport }).promise;

                            const textContent = await page.getTextContent();
                            const pdfTextItems = textContent.items.map(item => {
                                const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
                                const fontHeight = Math.hypot(tx[2], tx[3]) || Math.abs(item.height * viewport.scale) || 12;
                                return {
                                    str: item.str,
                                    x: tx[4],
                                    y: tx[5] - fontHeight,
                                    fontSize: fontHeight,
                                    width: Math.abs(item.width * viewport.scale),
                                    transform: tx
                                };
                            });

                            pagesData.push({
                                baseCanvas: cloneCanvas(canvas),
                                rawCanvas: cloneCanvas(canvas),
                                pdfTextItems: pdfTextItems,
                                ocrWords: [],
                                texts: [],
                                pasteLayers: []
                            });
                        }
                    } else if (file.type.startsWith('image/')) {
                        await new Promise((resolve) => {
                            const objectUrl = URL.createObjectURL(file);
                            const img = new Image();
                            img.onload = function() {
                                const canvas = document.createElement('canvas');
                                canvas.width = img.width;
                                canvas.height = img.height;
                                canvas.getContext('2d').drawImage(img, 0, 0);
                                URL.revokeObjectURL(objectUrl);

                                const pageObj = {
                                    baseCanvas: cloneCanvas(canvas),
                                    rawCanvas: cloneCanvas(canvas),
                                    pdfTextItems: [],
                                    ocrWords: [],
                                    texts: [],
                                    pasteLayers: []
                                };
                                pagesData.push(pageObj);
                                runImageOCR(canvas).then(words => { pageObj.ocrWords = words; });
                                resolve();
                            };
                            img.src = objectUrl;
                        });
                    }
                } catch (err) {
                    console.error(err);
                }
            }

            if (pagesData.length > 0) {
                updateMultiPageControlsUI();
                renderPageInEditor(0);
                resetZoom();
                showToast(`${pagesData.length} पेज लोड हुए`);
            }
        }

        function updateMultiPageControlsUI() {
            const ctrl = document.getElementById('multiPageControls');
            if (pagesData.length > 1) {
                ctrl.classList.remove('hidden');
                document.getElementById('pageIndicatorText').innerText = `${currentPageIndex + 1} / ${pagesData.length}`;
            } else {
                ctrl.classList.add('hidden');
            }
        }

        function saveCurrentPageInMemory() {
            if (pagesData[currentPageIndex] && masterCanvas) {
                pagesData[currentPageIndex].baseCanvas = cloneCanvas(masterCanvas);
                pagesData[currentPageIndex].texts = captureTextEdits();
            }
        }

        function changePdfPage(delta) {
            const nextIdx = currentPageIndex + delta;
            if (nextIdx >= 0 && nextIdx < pagesData.length) {
                commitActivePastedObject();
                saveCurrentPageInMemory();
                renderPageInEditor(nextIdx);
            }
        }

        function renderPageInEditor(idx) {
            currentPageIndex = idx;
            updateMultiPageControlsUI();

            const container = document.getElementById('fullScreenCanvasContainer');
            document.querySelectorAll('.seamless-text-item, .pdf-text-layer, .ocr-text-layer, .text-rotate-handle').forEach(el => el.remove());

            const pageObj = pagesData[currentPageIndex];
            const displayW = 800;
            const aspect = pageObj.baseCanvas.height / pageObj.baseCanvas.width;
            const displayH = displayW * aspect;

            container.style.width = `${displayW}px`;
            container.style.height = `${displayH}px`;
            container.innerHTML = `<canvas id="mainEditorCanvas" width="${pageObj.baseCanvas.width}" height="${pageObj.baseCanvas.height}" class="w-full h-full block"></canvas>`;

            masterCanvas = document.getElementById('mainEditorCanvas');
            masterCtx = masterCanvas.getContext('2d');
            masterCtx.drawImage(pageObj.baseCanvas, 0, 0);

            if (pageObj.pdfTextItems && pageObj.pdfTextItems.length > 0) {
                const textLayer = document.createElement('div');
                textLayer.className = 'pdf-text-layer';
                pageObj.pdfTextItems.forEach(item => {
                    if (!item.str.trim()) return;
                    const span = document.createElement('span');
                    span.textContent = item.str;
                    span.style.left = `${(item.x / pageObj.baseCanvas.width) * 100}%`;
                    span.style.top = `${(item.y / pageObj.baseCanvas.height) * 100}%`;
                    span.style.fontSize = `${item.fontSize * (displayW / pageObj.baseCanvas.width)}px`;
                    span.style.width = `${(item.width / pageObj.baseCanvas.width) * 100}%`;
                    span.ondblclick = (e) => {
                        if (moveMode) return;
                        e.stopPropagation(); e.preventDefault();
                        const elem = createSeamlessWordStyleText(item.x, item.y, item.str, { nativeFontSize: item.fontSize }, true, true);
                        enableTextEditing(elem, true);
                    };
                    textLayer.appendChild(span);
                });
                container.appendChild(textLayer);
            }

            if (pageObj.ocrWords && pageObj.ocrWords.length > 0) {
                const ocrLayer = document.createElement('div');
                ocrLayer.className = 'ocr-text-layer';
                pageObj.ocrWords.forEach(word => {
                    const span = document.createElement('span');
                    span.textContent = word.text;
                    span.dataset.wordX = String(word.x);
                    span.dataset.wordY = String(word.y);
                    span.dataset.wordHeight = String(word.height);
                    span.style.left = `${(word.x / pageObj.baseCanvas.width) * 100}%`;
                    span.style.top = `${(word.y / pageObj.baseCanvas.height) * 100}%`;
                    span.style.width = `${(word.width / pageObj.baseCanvas.width) * 100}%`;
                    span.style.height = `${(word.height / pageObj.baseCanvas.height) * 100}%`;
                    span.style.fontSize = `${Math.max(10, word.height * (displayH / pageObj.baseCanvas.height))}px`;
                    span.ondblclick = (e) => {
                        if (moveMode) return;
                        e.stopPropagation(); e.preventDefault();
                        const elem = createSeamlessWordStyleText(word.x, word.y, word.text, { nativeFontSize: word.height }, true, true);
                        enableTextEditing(elem, true);
                    };
                    ocrLayer.appendChild(span);
                });
                container.appendChild(ocrLayer);
            }

            if (pageObj.texts && pageObj.texts.length > 0) {
                pageObj.texts.forEach(item => {
                    createSeamlessWordStyleText(item.canvasX, item.canvasY, item.text, item, false, false);
                });
            }

            deselectAllText();
            initDirectCanvasEraserListeners();
            initStampCanvasListeners();
            initBoxSelectionEngine();
            applyZoomUI();
            if (undoStack.length === 0) saveUndoState();
        }

        function cloneCanvas(c) {
            const out = document.createElement('canvas');
            out.width = c.width; out.height = c.height;
            out.getContext('2d').drawImage(c, 0, 0);
            return out;
        }

        function captureTextEdits() {
            return [...document.querySelectorAll('.seamless-text-item')].map(el => ({
                text: el.textContent,
                canvasX: parseFloat(el.dataset.canvasX) || 0,
                canvasY: parseFloat(el.dataset.canvasY) || 0,
                nativeFontSize: parseFloat(el.dataset.nativeFontSize) || 28,
                color: el.style.color || '#22252a',
                opacity: el.style.opacity || '1',
                blur: el.dataset.blur || '0',
                fontWeight: el.style.fontWeight || '400',
                fontStyle: el.style.fontStyle || 'normal',
                textDecoration: el.style.textDecoration || 'none',
                fontClass: [...el.classList].find(c => c.startsWith('font-')) || 'font-devanagari',
                rotation: parseFloat(el.dataset.rotation) || 0
            }));
        }

        function reloadOriginalCanvasState() {
            if (confirm("क्या आप कैनवास को रीसेट करना चाहते हैं?")) {
                if (pagesData.length > 0) {
                    commitActivePastedObject();
                    saveUndoState();
                    pagesData[currentPageIndex].baseCanvas = cloneCanvas(pagesData[currentPageIndex].rawCanvas);
                    pagesData[currentPageIndex].texts = [];
                    pagesData[currentPageIndex].pasteLayers = [];
                    renderPageInEditor(currentPageIndex);
                }
            }
        }

        function updateTextElemPosition(elem, canvasX, canvasY) {
            if (!masterCanvas) return;
            elem.dataset.canvasX = canvasX;
            elem.dataset.canvasY = canvasY;
            elem.style.left = `${(canvasX / masterCanvas.width) * 100}%`;
            elem.style.top = `${(canvasY / masterCanvas.height) * 100}%`;
            const displayScale = (masterCanvas.offsetWidth || 800) / masterCanvas.width;
            const nativePx = parseFloat(elem.dataset.nativeFontSize || 28);
            elem.style.fontSize = `${nativePx * displayScale}px`;
            if (!elem.classList.contains('editing')) {
                const rot = parseFloat(elem.dataset.rotation) || 0;
                elem.style.transform = rot ? `rotate(${rot}deg)` : 'none';
            }
            if (elem.classList.contains('selected') && !elem.classList.contains('editing')) {
                positionTextRotateHandle(elem);
            }
        }

        function createSeamlessWordStyleText(canvasX, canvasY, text = "", opts = {}, saveUndo = true, startEditing = false) {
            if (saveUndo) saveUndoState();
            const container = document.getElementById('fullScreenCanvasContainer');
            const fontStyle = opts.fontClass || (document.getElementById('editorFontFamily') ? document.getElementById('editorFontFamily').value : 'font-devanagari');
            const inkColor = opts.color || document.getElementById('liveInkColor').value;
            const opacityVal = opts.opacity !== undefined ? parseFloat(opts.opacity) : (document.getElementById('inkOpacityRange') ? document.getElementById('inkOpacityRange').value / 100 : 0.9);
            const nativeFontSize = opts.nativeFontSize || 28;
            const blurVal = opts.blur || (document.getElementById('textBlurRange') ? document.getElementById('textBlurRange').value : '0');

            const elem = document.createElement('div');
            elem.className = `seamless-text-item ${fontStyle}`;
            elem.contentEditable = "false";
            elem.spellcheck = false;
            elem.setAttribute('lang', 'hi');
            elem.setAttribute('dir', 'auto');
            elem.setAttribute('translate', 'no');
            elem.innerText = text;

            elem.dataset.nativeFontSize = String(nativeFontSize);
            elem.dataset.blur = String(blurVal);
            elem.dataset.rotation = String(opts.rotation || 0);
            elem.style.color = inkColor;
            elem.style.opacity = opacityVal;
            elem.style.filter = blurVal > 0 ? `blur(${blurVal}px)` : 'none';
            elem.style.fontWeight = String(opts.fontWeight || '400');
            if (opts.fontStyle) elem.style.fontStyle = opts.fontStyle;
            if (opts.textDecoration) elem.style.textDecoration = opts.textDecoration;

            updateTextElemPosition(elem, canvasX, canvasY);
            container.appendChild(elem);
            makeElementMouseDraggable(elem);

            if (startEditing) {
                enableTextEditing(elem, true);
            } else {
                selectTextElem(elem);
            }

            elem.addEventListener('input', () => {
                elem.setAttribute('lang', 'hi');
                elem.setAttribute('dir', 'auto');
                if (pagesData[currentPageIndex]) {
                    pagesData[currentPageIndex].texts = captureTextEdits();
                }
            });

            elem.addEventListener('compositionstart', () => {
                elem.dataset.composing = '1';
                elem.setAttribute('lang', 'hi');
            });
            elem.addEventListener('compositionend', () => {
                elem.dataset.composing = '0';
                elem.setAttribute('lang', 'hi');
                if (pagesData[currentPageIndex]) {
                    pagesData[currentPageIndex].texts = captureTextEdits();
                }
            });

            elem.addEventListener('focus', () => {
                elem.setAttribute('lang', 'hi');
                elem.setAttribute('dir', 'auto');
            });

            elem.addEventListener('blur', () => {
                if (elem.dataset.composing === '1') {
                    setTimeout(() => { try { elem.focus(); } catch(e){} }, 0);
                    return;
                }
                disableTextEditing(elem);
                if (!elem.innerText.trim()) {
                    removeTextRotateHandle(elem);
                    deselectTextElem(elem);
                    elem.remove();
                } else if (pagesData[currentPageIndex]) {
                    pagesData[currentPageIndex].texts = captureTextEdits();
                }
            });

            return elem;
        }

        function enableTextEditing(elem, selectAll = false, clientX = null, clientY = null) {
            if (moveMode) return;
            document.querySelectorAll('.seamless-text-item').forEach(el => {
                if (el !== elem) {
                    el.classList.remove('selected');
                    disableTextEditing(el);
                    positionTextRotateHandle(el);
                }
            });
            selectedTextElems = [elem];
            selectedTextElem = elem;
            elem.classList.add('selected');
            if (elem._rotateHandle) {
                elem._rotateHandle.classList.remove('visible');
                elem._rotateHandle.style.display = 'none';
            }

            elem.contentEditable = "true";
            elem.classList.add('editing');
            elem.setAttribute('lang', 'hi');
            elem.setAttribute('dir', 'auto');
            elem.setAttribute('inputmode', 'text');
            elem.setAttribute('spellcheck', 'false');
            elem.style.filter = 'none';
            elem.focus();

            setTimeout(() => {
                try {
                    if (!elem.isConnected) return;
                    elem.focus();
                    const sel = window.getSelection();
                    const range = document.createRange();
                    sel.removeAllRanges();
                    if (selectAll) {
                        range.selectNodeContents(elem);
                    } else {
                        range.selectNodeContents(elem);
                        range.collapse(false);
                    }
                    sel.addRange(range);
                } catch (err) {}
            }, 20);
        }

        function disableTextEditing(elem) {
            if (!elem) return;
            elem.contentEditable = "false";
            elem.classList.remove('editing');
            const blurVal = elem.dataset.blur || '0';
            elem.style.filter = blurVal > 0 ? `blur(${blurVal}px)` : 'none';
            const rot = parseFloat(elem.dataset.rotation) || 0;
            elem.style.transform = rot ? `rotate(${rot}deg)` : 'none';
            if (elem.classList.contains('selected')) {
                positionTextRotateHandle(elem);
            }
        }

        function makeElementMouseDraggable(elem) {
            let isDragging = false, startMouseX = 0, startMouseY = 0;
            let initialPositions = [];
            
            elem.addEventListener('mousedown', e => {
                if (isEraserMode || isSpacePressed || activePsTool === 'hand' || e.button !== 0 || elem.classList.contains('editing')) return;
                e.stopPropagation();
                e.preventDefault();
                
                if (!selectedTextElems.includes(elem)) {
                    if (!e.shiftKey) deselectAllText();
                    selectTextElem(elem, true);
                }
                
                isDragging = true; 
                startMouseX = e.clientX; 
                startMouseY = e.clientY;

                initialPositions = selectedTextElems.map(el => ({
                    el,
                    initX: parseFloat(el.dataset.canvasX) || 0,
                    initY: parseFloat(el.dataset.canvasY) || 0
                }));
            });

            elem.addEventListener('dblclick', e => {
                if (isEraserMode || isSpacePressed || moveMode) return;
                e.stopPropagation();
                e.preventDefault();
                enableTextEditing(elem, false, e.clientX, e.clientY);
            });

            const move = e => {
                if (!isDragging || !masterCanvas || elem.classList.contains('editing')) return;
                const rect = masterCanvas.getBoundingClientRect();
                const scaleX = masterCanvas.width / rect.width;
                const scaleY = masterCanvas.height / rect.height;

                const dx = (e.clientX - startMouseX) * scaleX;
                const dy = (e.clientY - startMouseY) * scaleY;

                initialPositions.forEach(item => {
                    const newCanvasX = Math.max(0, Math.min(masterCanvas.width - 10, item.initX + dx));
                    const newCanvasY = Math.max(0, Math.min(masterCanvas.height - 10, item.initY + dy));
                    updateTextElemPosition(item.el, newCanvasX, newCanvasY);
                });
            };

            const up = () => {
                if (isDragging) {
                    isDragging = false;
                    saveUndoState();
                }
            };

            document.addEventListener('mousemove', move); 
            document.addEventListener('mouseup', up);
        }

        function initBoxSelectionEngine() {
            const container = document.getElementById('fullScreenCanvasContainer');
            if (!container) return;

            container.ondblclick = function(e) {
                if (isEraserMode || isSpacePressed || moveMode || activePsTool === 'hand') return;
                e.preventDefault();
                e.stopImmediatePropagation();

                const existingText = e.target.closest && e.target.closest('.seamless-text-item');
                if (existingText && container.contains(existingText)) {
                    enableTextEditing(existingText, false, e.clientX, e.clientY);
                    return;
                }

                const pos = getCanvasNativeCoordinates(e.clientX, e.clientY);
                lastClickCanvasPos = pos;

                let sourceText = '';
                let sourceOpts = {};
                const ocrLayer = e.target.closest && e.target.closest('.ocr-text-layer');
                if (ocrLayer) {
                    const spans = ocrLayer.querySelectorAll('span');
                    for (const span of spans) {
                        const r = span.getBoundingClientRect();
                        if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
                            sourceText = span.textContent || '';
                            if (span.dataset && span.dataset.wordHeight) {
                                sourceOpts.nativeFontSize = parseFloat(span.dataset.wordHeight) || 28;
                            }
                            break;
                        }
                    }
                }

                const elem = createSeamlessWordStyleText(pos.x, pos.y, sourceText, sourceOpts, true, false);
                if (elem) {
                    enableTextEditing(elem, false, e.clientX, e.clientY);
                }
            };

            container.onmousedown = function(e) {
                if (isEraserMode || isSpacePressed || moveMode || activePsTool === 'hand' || e.button !== 0) return;
                const pos = getCanvasNativeCoordinates(e.clientX, e.clientY);
                lastClickCanvasPos = pos;

                if (e.target.classList.contains('seamless-text-item') || e.target.closest('.pdf-text-layer') || e.target.closest('.ocr-text-layer')) return;

                const rect = container.getBoundingClientRect();
                boxSelectStart = {
                    x: (e.clientX - rect.left) / currentZoom,
                    y: (e.clientY - rect.top) / currentZoom,
                    clientX: e.clientX,
                    clientY: e.clientY
                };
                isBoxSelecting = true;
                if (!e.shiftKey) deselectAllText();
            };
        }

        window.addEventListener('mousemove', (e) => {
            if (!isBoxSelecting || isEraserMode || isSpacePressed || moveMode) return;
            const container = document.getElementById('fullScreenCanvasContainer');
            if (!container) return;

            const rect = container.getBoundingClientRect();
            const currentX = (e.clientX - rect.left) / currentZoom;
            const currentY = (e.clientY - rect.top) / currentZoom;

            const dist = Math.hypot(e.clientX - boxSelectStart.clientX, e.clientY - boxSelectStart.clientY);

            if (dist > 5 && !marqueeElem) {
                marqueeElem = document.createElement('div');
                marqueeElem.className = 'selection-marquee';
                container.appendChild(marqueeElem);
            }

            if (marqueeElem) {
                const x = Math.min(boxSelectStart.x, currentX);
                const y = Math.min(boxSelectStart.y, currentY);
                const w = Math.abs(currentX - boxSelectStart.x);
                const h = Math.abs(currentY - boxSelectStart.y);

                marqueeElem.style.left = `${x}px`;
                marqueeElem.style.top = `${y}px`;
                marqueeElem.style.width = `${w}px`;
                marqueeElem.style.height = `${h}px`;

                const mRect = { left: x, top: y, right: x + w, bottom: y + h };
                document.querySelectorAll('.seamless-text-item').forEach(el => {
                    const elLeft = el.offsetLeft, elTop = el.offsetTop;
                    const intersects = !(elLeft > mRect.right || (elLeft + el.offsetWidth) < mRect.left || elTop > mRect.bottom || (elTop + el.offsetHeight) < mRect.top);
                    if (intersects) selectTextElem(el, true);
                    else if (!e.shiftKey) deselectTextElem(el);
                });
            }
        });

        window.addEventListener('mouseup', () => {
            if (isBoxSelecting) {
                if (marqueeElem) { marqueeElem.remove(); marqueeElem = null; }
                isBoxSelecting = false;
            }
        });

        /* ========== TEXT / PASTE ROTATION ========== */
        function attachTextRotateHandle(elem) {
            if (!elem) return;
            if (elem._rotateHandle && elem._rotateHandle.isConnected) {
                positionTextRotateHandle(elem);
                return;
            }
            const container = document.getElementById('fullScreenCanvasContainer');
            if (!container) return;
            const handle = document.createElement('div');
            handle.className = 'text-rotate-handle';
            handle.innerHTML = '<i class="fa-solid fa-rotate-right"></i>';
            handle.title = 'घुमाएँ / तिरछा करें (ड्रैग करें)';
            handle.setAttribute('contenteditable', 'false');
            handle.addEventListener('mousedown', (e) => {
                e.stopPropagation();
                e.preventDefault();
                startTextRotation(elem, e);
            });
            container.appendChild(handle);
            elem._rotateHandle = handle;
            positionTextRotateHandle(elem);
        }

        function positionTextRotateHandle(elem) {
            const handle = elem && elem._rotateHandle;
            if (!handle || !elem) return;
            if (!elem.classList.contains('selected') || elem.classList.contains('editing')) {
                handle.classList.remove('visible');
                handle.style.display = 'none';
                return;
            }
            handle.classList.add('visible');
            handle.style.display = 'flex';
            handle.style.left = `${elem.offsetLeft + elem.offsetWidth + 4}px`;
            handle.style.top = `${Math.max(0, elem.offsetTop - 20)}px`;
        }

        function removeTextRotateHandle(elem) {
            if (elem && elem._rotateHandle) {
                try { elem._rotateHandle.remove(); } catch (e) {}
                elem._rotateHandle = null;
            }
        }

        function hideAllTextRotateHandles() {
            document.querySelectorAll('.text-rotate-handle').forEach(h => {
                h.classList.remove('visible');
                h.style.display = 'none';
            });
        }

        function startTextRotation(elem, e) {
            if (!elem || !masterCanvas) return;
            saveUndoState();
            const rect = elem.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const startAngle = Math.atan2(e.clientY - cy, e.clientX - cx);
            const baseRot = parseFloat(elem.dataset.rotation) || 0;

            const onMove = (me) => {
                const ang = Math.atan2(me.clientY - cy, me.clientX - cx);
                let deg = baseRot + ((ang - startAngle) * 180 / Math.PI);
                if (Math.abs(deg % 15) < 2) deg = Math.round(deg / 15) * 15;
                elem.dataset.rotation = String(deg);
                elem.style.transform = `rotate(${deg}deg)`;
            };
            const onUp = () => {
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);
                if (pagesData[currentPageIndex]) pagesData[currentPageIndex].texts = captureTextEdits();
                showToast('शब्द घुमाया: ' + Math.round(parseFloat(elem.dataset.rotation) || 0) + '°');
            };
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
        }

        function startPasteRotation(e) {
            if (!activePastedElem || !activePastedData || !masterCanvas) return;
            e.stopPropagation();
            e.preventDefault();
            const rect = activePastedElem.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const startAngle = Math.atan2(e.clientY - cy, e.clientX - cx);
            const baseRot = activePastedData.rotation || 0;

            const onMove = (me) => {
                const ang = Math.atan2(me.clientY - cy, me.clientX - cx);
                let deg = baseRot + ((ang - startAngle) * 180 / Math.PI);
                if (Math.abs(deg % 15) < 2) deg = Math.round(deg / 15) * 15;
                activePastedData.rotation = deg;
                activePastedElem.style.transform = `rotate(${deg}deg)`;
            };
            const onUp = () => {
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);
                showToast('पेस्ट घुमाया: ' + Math.round(activePastedData.rotation || 0) + '°');
            };
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
        }

        function deselectAllText() {
            document.querySelectorAll('.seamless-text-item').forEach(el => {
                el.classList.remove('selected');
                disableTextEditing(el);
                positionTextRotateHandle(el);
            });
            hideAllTextRotateHandles();
            selectedTextElems = [];
            selectedTextElem = null;
        }

        function deselectTextElem(elem) {
            elem.classList.remove('selected');
            disableTextEditing(elem);
            positionTextRotateHandle(elem);
            selectedTextElems = selectedTextElems.filter(el => el !== elem);
            selectedTextElem = selectedTextElems.length > 0 ? selectedTextElems[0] : null;
        }

        function selectTextElem(elem, append = false) {
            if (!append) deselectAllText();
            if (!selectedTextElems.includes(elem)) {
                elem.classList.add('selected');
                selectedTextElems.push(elem);
            }
            selectedTextElem = elem;
            if (!elem.classList.contains('editing')) {
                attachTextRotateHandle(elem);
                positionTextRotateHandle(elem);
            }

            if (activePsTool !== 'text') selectPsTool('text');

            const fontClass = [...elem.classList].find(c => c.startsWith('font-')) || 'font-devanagari';
            const fontSel = document.getElementById('editorFontFamily');
            if (fontSel) fontSel.value = fontClass;
            
            const nativeSize = parseFloat(elem.dataset.nativeFontSize || 28);
            const sizeVal = document.getElementById('fontSizeVal');
            if (sizeVal) sizeVal.innerText = `${Math.round(nativeSize)}px`;

            const weightVal = document.getElementById('fontWeightVal');
            if (weightVal) weightVal.innerText = elem.style.fontWeight || '400';

            const blurRange = document.getElementById('textBlurRange');

            if (ink && elem.style.color) {
                try {
                    const c = elem.style.color;
                    if (c.startsWith('#')) ink.value = c;
                    else if (c.startsWith('rgb')) {
                        const m = c.match(/\d+/g);
                        if (m && m.length >= 3) {
                            ink.value = '#' + [m[0], m[1], m[2]].map(n => (+n).toString(16).padStart(2, '0')).join('');
                        }
                    }

        function adjustSelectedFontSize(delta) {
            if (selectedTextElems.length === 0) return;
            saveUndoState();
            selectedTextElems.forEach(elem => {
                const currentNative = parseFloat(elem.dataset.nativeFontSize || 28);
                const newNative = Math.max(8, Math.min(250, currentNative + delta));
                elem.dataset.nativeFontSize = String(newNative);
                updateTextElemPosition(elem, parseFloat(elem.dataset.canvasX) || 0, parseFloat(elem.dataset.canvasY) || 0);

        function saveUndoState() {
            if (!masterCanvas) return;

            redoStack = [];

        function performUndo() {
            commitActivePastedObject();
            if (undoStack.length > 1) {
                redoStack.push(undoStack.pop());
                restoreStateSnapshot(undoStack[undoStack.length - 1]);
                showToast("Undo किया गया");
            }
        }

        function performRedo() {
            commitActivePastedObject();
            if (redoStack.length > 0) {
                const next = redoStack.pop();
                undoStack.push(next);
                restoreStateSnapshot(next);
                showToast("Redo किया गया");

            img.src = snapshot.canvasData;

            document.querySelectorAll('.seamless-text-item, .text-rotate-handle').forEach(el => el.remove());
            snapshot.texts.forEach(item => createSeamlessWordStyleText(item.canvasX, item.canvasY, item.text, item, false, false));

        function initDirectCanvasEraserListeners() {

        function updateEraserPreviewDOM(pNative) {
            if (!eraserPreview || !eraserStart || !masterCanvas) return;
            const pctStartX = (eraserStart.x / masterCanvas.width) * 100;
            const pctStartY = (eraserStart.y / masterCanvas.height) * 100;
            const pctPx = (pNative.x / masterCanvas.width) * 100;
            const pctPy = (pNative.y / masterCanvas.height) * 100;

            const leftPct = Math.min(pctStartX, pctPx);
            const topPct = Math.min(pctStartY, pctPy);
            const widthPct = Math.max((eraserBrushSize / masterCanvas.width) * 100, Math.abs(pctPx - pctStartX));
            const heightPct = Math.max((eraserBrushSize / masterCanvas.height) * 100, Math.abs(pctPy - pctStartY));

            eraserPreview.style.left = `${leftPct}%`; 
            eraserPreview.style.top = `${topPct}%`;
            eraserPreview.style.width = `${widthPct}%`; 
            eraserPreview.style.height = `${heightPct}%`;
            eraserPreview.style.borderRadius = eraserShape === 'circle' ? '50%' : '0';
        }

        window.addEventListener('mousemove', (e) => {
            if (isEraserMode && isErasing && masterCanvas) {
                updateEraserPreviewDOM(getCanvasNativeCoordinates(e.clientX, e.clientY));
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (!isEraserMode || !isErasing || !masterCanvas) return;
            isErasing = false;
            const pos = getCanvasNativeCoordinates(e.clientX, e.clientY);
            saveUndoState();

            const minX = Math.min(eraserStart.x, pos.x);
            const minY = Math.min(eraserStart.y, pos.y);
            const w = Math.max(eraserBrushSize, Math.abs(pos.x - eraserStart.x));
            const h = Math.max(eraserBrushSize, Math.abs(pos.y - eraserStart.y));

            eraseRectSelection(minX, minY, w, h);

        });

        /**
         * स्मार्ट पेपर बैकग्राउंड सैंपलर (Smart Document Paper Background Sampler)
         */
        function getSurroundingPaperColor(x, y, w, h) {
            if (!masterCtx || !masterCanvas) return document.getElementById('eraserColor')?.value || '#ffffff';
            try {
                const sx = Math.max(0, Math.floor(x - 6));
                const sy = Math.max(0, Math.floor(y - 6));
                const sw = Math.min(masterCanvas.width - sx, Math.ceil(w + 12));
                const sh = Math.min(masterCanvas.height - sy, Math.ceil(h + 12));
                const imgData = masterCtx.getImageData(sx, sy, sw, sh).data;
                
                let rTotal = 0, gTotal = 0, bTotal = 0, count = 0;
                for (let py = 0; py < sh; py++) {
                    for (let px = 0; px < sw; px++) {
                        const isBorder = (py < 4 || py >= sh - 4 || px < 4 || px >= sw - 4);
                        if (isBorder) {
                            const idx = (py * sw + px) * 4;
                            const r = imgData[idx], g = imgData[idx + 1], b = imgData[idx + 2];
                            if ((r + g + b) / 3 > 90) {
                                rTotal += r; gTotal += g; bTotal += b;
                                count++;
                            }
                        }
                    }
                }
                if (count > 0) {
                    const avgR = Math.round(rTotal / count);
                    const avgG = Math.round(gTotal / count);
                    const avgB = Math.round(bTotal / count);
                    return `rgb(${avgR}, ${avgG}, ${avgB})`;
                }
            } catch(e) {}
            return document.getElementById('eraserColor')?.value || '#ffffff';
        }

        function toggleMagicEraser(on) {
            magicEraserMode = !!on;
            if (typeof eraserOpacity === 'number' && magicEraserMode && eraserOpacity < 70) {
                eraserOpacity = 90;
            }
            renderTopOptionsBar('eraser');
            showToast(magicEraserMode
                ? "Magic ON — Eyedropper से रंग चुनें, बॉक्स खींचें → सिर्फ वही रंग मिटेगा"
                : "Normal Eraser — पूरा बॉक्स मिटेगा");
        }
        function updateMagicTolerance(val) {
            magicEraserTolerance = parseInt(val) || 40;
            const el = document.getElementById('magicTolVal');
            if (el) el.innerText = String(magicEraserTolerance);
        }
        function parseColorToRGB(c) {
            let r = 255, g = 255, b = 255;
            if (!c || typeof c !== 'string') return { r, g, b };
            if (c.startsWith('#')) {
                const h = c.slice(1);
                if (h.length === 3) {
                    r = parseInt(h[0]+h[0], 16); g = parseInt(h[1]+h[1], 16); b = parseInt(h[2]+h[2], 16);
                } else if (h.length >= 6) {
                    r = parseInt(h.slice(0,2), 16); g = parseInt(h.slice(2,4), 16); b = parseInt(h.slice(4,6), 16);
                }
            } else {
                const m = c.match(/\d+/g);
                if (m && m.length >= 3) { r = +m[0]; g = +m[1]; b = +m[2]; }
            }
            return { r, g, b };
        }
        function colorDistance(r1, g1, b1, r2, g2, b2) {
            const dr = r1 - r2, dg = g1 - g2, db = b1 - b2;
            return Math.sqrt(dr*dr + dg*dg + db*db);
        }

        function eraseRectSelection(x, y, w, h) {
            if (!masterCtx || !masterCanvas || w < 1 || h < 1) return;
            saveUndoState();

            const autoToggle = document.getElementById('autoBgColorToggle');
            const isAutoBg = !autoToggle || autoToggle.checked;
            let fillColor = '#ffffff';
            if (isAutoBg) {
                fillColor = getSurroundingPaperColor(x, y, w, h);
            } else {
                fillColor = document.getElementById('eraserColor')?.value || '#ffffff';
            }
            const fill = parseColorToRGB(fillColor);
            const rawOp = (typeof eraserOpacity === 'number') ? eraserOpacity : 90;
            const opacity = Math.min(1, Math.max(0.15, rawOp / 100));

            const rx = Math.max(0, Math.floor(x));
            const ry = Math.max(0, Math.floor(y));
            const rw = Math.min(masterCanvas.width - rx, Math.ceil(w));
            const rh = Math.min(masterCanvas.height - ry, Math.ceil(h));
            if (rw < 1 || rh < 1) return;

            if (magicEraserMode) {
                // MAGIC: fully wipe matching color (not fade)
                const target = parseColorToRGB(document.getElementById('eraserColor')?.value || '#000000');
                const tol = Math.max(5, magicEraserTolerance || 40);
                const imgData = masterCtx.getImageData(rx, ry, rw, rh);
                const d = imgData.data;
                const isCircle = eraserShape === 'circle';
                const cx = (x - rx) + w / 2;
                const cy = (y - ry) + h / 2;
                const rad = Math.max(w, h) / 2;
                // opacity 100 => full wipe in one pass for good matches
                const strength = Math.min(1, Math.max(0.4, opacity));

                for (let py = 0; py < rh; py++) {
                    for (let px = 0; px < rw; px++) {
                        if (isCircle) {
                            if (Math.hypot(px + 0.5 - cx, py + 0.5 - cy) > rad) continue;
                        }
                        const i = (py * rw + px) * 4;
                        const pr = d[i], pg = d[i+1], pb = d[i+2];
                        const dist = colorDistance(pr, pg, pb, target.r, target.g, target.b);
                        if (dist > tol) continue;

                        // Strong replace: exact match = full paper; near tol = still solid wipe
                        let match = 1 - (dist / tol);
                        let f;
                        if (strength >= 0.75) {
                            // High opacity: wipe hard in 1 pass
                            f = (dist < tol * 0.7) ? 1 : Math.max(0.65, match);
                        } else {
                            f = Math.min(1, Math.max(0.45, match * strength * 1.5));
                        }
                        d[i]     = Math.round(pr * (1 - f) + fill.r * f);
                        d[i + 1] = Math.round(pg * (1 - f) + fill.g * f);
                        d[i + 2] = Math.round(pb * (1 - f) + fill.b * f);
                    }
                }
                masterCtx.putImageData(imgData, rx, ry);
            } else {
                // NORMAL: fill whole rect/circle with paper color
                masterCtx.save();
                masterCtx.globalAlpha = opacity;
                masterCtx.fillStyle = fillColor;
                if (eraserShape === 'circle') {
                    masterCtx.beginPath();
                    masterCtx.arc(x + w / 2, y + h / 2, Math.max(w, h) / 2, 0, Math.PI * 2);
                    masterCtx.fill();
                } else {
                    masterCtx.fillRect(x, y, w, h);
                }
                masterCtx.restore();
            }

            document.querySelectorAll('.seamless-text-item').forEach(el => {
                const lx = parseFloat(el.dataset.canvasX) || 0;
                const ly = parseFloat(el.dataset.canvasY) || 0;
                if (lx >= x && lx <= x + w && ly >= y && ly <= y + h) el.remove();
            });
            saveCurrentPageInMemory();
        }

        function removeEraserPreview() { if (eraserPreview) { eraserPreview.remove(); eraserPreview = null; } }

        /* CLONE STAMP TOOL */
        function toggleStampTool(forceState) {
            isStampMode = forceState !== undefined ? forceState : !isStampMode;
            const canvasContainer = document.getElementById('fullScreenCanvasContainer');

            if (isStampMode) {

                showToast("Alt + Click से सोर्स कॉपी करें, फिर पेंट करें");
            } else {
                stampSourcePoint = null;
                isStampPainting = false;
                removeStampCursorPreview();
                if (masterCanvas) masterCanvas.classList.remove('eraser-active');
                if (canvasContainer) canvasContainer.classList.remove('eraser-mode-active');
